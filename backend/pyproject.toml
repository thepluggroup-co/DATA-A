[project]
name = "plateforme"
version = "0.1.0"
description = "Plateforme d'études de marché de bout en bout — THE PLUG (nom produit : [NOM_PRODUIT])"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "tzdata>=2026.5",
    "pyreadstat>=1.3.6",
    "pandas>=3.0.6",
]

[project.scripts]
plateforme = "plateforme.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
    "types-openpyxl>=3.1.5.20261017",
    "pandas-stubs>=3.0.5.260914",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plateforme"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]   # caractères typographiques français (’ « » – …) voulus

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
