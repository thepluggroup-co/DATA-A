[project]
name = "plateforme"
version = "0.1.0"
description = "Plateforme d'études de marché de bout en bout — THE PLUG (produit : DATA'A)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "tzdata>=2026.5",
    "pyreadstat>=1.3.6",
    "pandas>=3.0.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "scipy>=1.18.1",
    "python-docx>=1.2.0",
    "qrcode>=7.4",
    "pillow>=13.0.0",
    "statsmodels>=0.15.0",
    "prince>=0.21.0",
    "python-pptx>=1.0.2",
    "matplotlib>=3.11.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyotp>=2.9",
    "argon2-cffi>=23.1",
]

[project.scripts]
plateforme = "plateforme.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
    "types-openpyxl>=3.1.5.20261017",
    "pandas-stubs>=3.0.5.260914",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plateforme"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Les environnements Windows verrouillent parfois AppData\Local\Temp ; garder
# les fixtures et les clusters PostgreSQL de test dans un dossier du projet.
addopts = "-ra --basetemp=.pytest-tmp"

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]   # caractères typographiques français (’ « » – …) voulus

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["scipy.*", "qrcode.*", "statsmodels.*", "prince.*"]
ignore_missing_imports = true
