  # ------------------------------------------------------------------------------------------- III.A traitement (p. 20-24)
  - {section: "III. Résultats de l'enquête", niveau: 1}
  - {section: "A. Traitement des données", niveau: 2}
  - {section: "1) Remarques", niveau: 3}
  - {texte: "Définition des codes [[lit:99]] et [[lit:98]] : deux codes désignent deux situations différentes. Le code [[lit:99]] (non-réponse) signifie que la question a été posée mais que la case est restée vide ; les non-réponses sont exclues des pourcentages, dans toutes les questions. Le code [[lit:98]] signifie que le répondant a coché une case prévue au questionnaire : « Sans avis » pour l'origine des produits (Q15, Q16, Q21, Q22) ou « NSP » pour le revenu (Q5)."}
  - {texte: "« Sans avis » est conservé comme une réponse, car l'absence d'avis est un résultat. « NSP » est en revanche exclu des pourcentages du revenu, car il ne renseigne pas sur le niveau de revenu. Le tableau 6 donne, pour chaque variable, la part des réponses, des « Sans avis / NSP » et des non-réponses."}
  - {texte: "Observations prises en compte : les statistiques portent sur les [[base.retenues]] fiches retenues, et pour chaque question sur les réponses valides. La base d'analyse livrée contient ces [[base.retenues]] fiches ; la base de collecte ([[base.collectees]] fiches) est conservée pour la traçabilité des [[base.ecartees]] fiches écartées. Les variables du questionnaire, les variables d'identification et de contrôle de la fiche et les variables dérivées (regroupements, indicateurs, scores) sont toutes décrites dans le dictionnaire des variables."}
  - {texte: "Précision et tests statistiques : les règles de lecture sont fixées par la note de lecture méthodologique en début de rapport. Les écarts globaux entre villes et entre profils ont été testés (khi-deux sur le tableau complet, Kruskal-Wallis pour le surcoût et la garantie) : ils sont significatifs au seuil de [[lit:5]] % pour la plupart des questions (V de Cramér de [[t5.v_min]] à [[t5.v_max]]). Les comparaisons entre deux villes ou deux profils précis n'ont été testées qu'aux endroits signalés ; ailleurs, elles sont descriptives. Le tableau 5 en donne le détail : la ville différencie nettement plus que le profil."}
  - {tableau: "5", id: t5, titre: "Écarts entre villes et entre profils – tests du khi-deux (V de Cramér et p)", source: "N08_A_RAPPORT_427.sps:121-127", source_affichee: "traitements statistiques de la base d'analyse",
     procedure: synthese_khi2, arguments: {variables: [MARQ_AC, DUGAJUAC, ORIG_MARQ, IMSECSAV, FIMEFOUR, ECQUHABA, MEQUAFIA, CRACPRCO, ORINFACH,
                                                       FREQACHA, SUACMOGA, PRETACLI, GAACPLSO, PRIOPRIN, DEJDECAC, MEME_CANAL, DEJACHLI],
                                           par: [VILLEREG, PROFIL4], kruskal: {DUGAJUAC: [PROFIL4]}}}
  - {texte: "Note de lecture : V de Cramér de [[lit:0]] (aucun lien) à [[lit:1]] (lien total) ; au-delà de [[lit:0,30]], le lien est net. n.s. = non significatif au seuil de [[lit:5]] %. * = plus de [[lit:20]] % des cases ont un effectif théorique inférieur à [[lit:5]], test à lire avec réserve. K-W = test de Kruskal-Wallis, qui tient compte de l'ordre des réponses. Le résidu ajusté signale la case qui s'écarte le plus de l'attendu (au-delà de ±[[lit:1,96]]). Ces tests supposent un tirage aléatoire : ils hiérarchisent les écarts, ils ne les certifient pas. À Douala, les écarts sur la garantie et l'importance du SAV sont amplifiés par un effet enquêteur (voir III.B.4)."}
  - {texte: "À la suite de la codification, les questions fermées ont donné une variable par question, une variable par modalité pour les questions à plusieurs réponses (Q9 et Q41), une variable par gamme pour Q23 et deux variables pour Q12 (marque de la liste et texte « Autre ») ; le consentement au recontact, recueilli avec l'identification de la fiche, complète la liste. Q41, prévue en réponses multiples mais recueillie avec une seule réponse sur chacune des fiches, est présentée comme le levier principal de fidélité."}
