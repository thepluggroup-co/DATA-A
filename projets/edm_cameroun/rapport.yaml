  - {calcul: influence_ville, procedure: tri_croise, arguments: {ligne: ORINFACH, colonne: VILLEREG}, source: "N08_A_RAPPORT_427.sps:259"}
  - {texte: "[[origine_pref.pct(4)]] % des acheteurs n'ont pas de préférence d'origine ; les autres se partagent entre l'Europe ([[origine_pref.pct(1)]] %) et l'Asie ([[origine_pref.pct(2)]] %). L'Europe est jugée meilleure en qualité par [[g47.pct(MEQUAFIA|1)]] % des répondants et l'Asie meilleure en prix par [[g47.pct(MEILPRIX|2)]] % ; un quart des répondants est sans avis. L'origine influence fortement ou modérément la décision d'achat de [[g51.pct(ORINFACH|1,2)]] % des répondants ; elle n'influence pas du tout [[g51.pct(ORINFACH|4)]] % d'entre eux, et [[influence_ville.col(4|1)]] % à Douala."}
