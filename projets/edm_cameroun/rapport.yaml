  # ------------------------------------------------------------------------------------------- note de lecture (V14 p. 4)
  - {section: "Note de lecture méthodologique", niveau: 1}
  - {texte: "Cette note s'applique à l'ensemble du rapport. Les précautions qu'elle énonce ne sont pas répétées sous chaque graphique : le lecteur s'y reporte."}
  - {texte: "[[base.collectees]] fiches collectées, [[base.retenues]] fiches analysées. La collecte s'est déroulée du [[lit:5]] au [[lit:8]] octobre [[lit:2026]] à Douala, Yaoundé et Bafoussam. Après contrôle de qualité, [[base.ecartees]] fiches ont été écartées ([[base.remplissage]] remplies à moins de [[lit:70]] %, [[base.copies]] copies quasi identiques). Tous les pourcentages portent sur les [[base.retenues]] fiches analysées et, pour chaque question, sur les réponses valides : la base (n) est indiquée sous chaque graphique et chaque tableau."}
  - {texte: "Un échantillon par quotas, non probabiliste. Les quotas ont organisé le travail de terrain ; ils n'ont pas été atteints pour plusieurs profils professionnels. Les pourcentages décrivent les acheteurs interrogés : ce ne sont ni des estimations pour l'ensemble du Cameroun, ni des parts de marché nationales."}
  - {texte: "Intervalles de confiance. Lorsqu'un intervalle de confiance à [[lit:95]] % ou une marge d'erreur est cité, il s'agit d'un repère indicatif sous hypothèse d'échantillonnage aléatoire, non représentatif du plan par quotas : il donne l'ordre de grandeur minimal de l'aléa, pas l'erreur réelle."}
  - {texte: "Écarts testés et écarts descriptifs. Les écarts globaux entre villes et entre profils ont été testés (khi-deux, Kruskal-Wallis). Un écart n'est qualifié de « significatif » que s'il a été testé (p < [[lit:0,05]]) ; les comparaisons ponctuelles non testées sont dites « descriptives » ou présentées comme des « tendances »."}
  - {texte: "Valeurs monétaires. La dépense annuelle est estimée à partir du point milieu des tranches de montant déclarées et de la fréquence d'achat ; elle sert à comparer les profils. Les parts en valeur sont données en fourchettes, jamais au dixième de point."}
  - {texte: "Chiffres et interprétations. Les chiffres sont issus de la base d'analyse ([[base.retenues]] fiches) ; chaque tableau et graphique peut être reproduit avec la syntaxe SPSS livrée avec la base, dont les titres reprennent la numérotation du rapport. Les passages introduits par « Notre lecture » sont des interprétations de l'analyste, à distinguer des résultats mesurés."}

  # ------------------------------------------------------------------------------------------- synthèse exécutive (p. 5-6)
  - {section: "Synthèse exécutive", niveau: 1}
  - {texte: "Étude quantitative de la distribution du matériel électrique – Douala, Yaoundé, Bafoussam – collecte du [[lit:5]] au [[lit:8]] octobre [[lit:2026]] – [[base.collectees]] fiches collectées, [[base.retenues]] fiches analysées."}
  - {texte: "Un marché de confiance entamée. [[s1.ligne(P_DECU)]] % des acheteurs ont déjà été déçus par un achat (n = [[s1.n(P_DECU)]]) et [[s1.ligne(P_CONTREF)]] % craignent d'acheter un produit contrefait ou non conforme (n = [[s1.n(P_CONTREF)]])."}
  - {texte: "Un discours qualité, une réalité prix. La qualité est le premier critère de choix ([[s1.ligne(P_QUAL)]] %, n = [[s1.n(P_QUAL)]]), mais [[s1.ligne(P_REFUS10)]] % refusent de payer plus de [[lit:10]] % pour monter en gamme (n = [[s1.n(P_REFUS10)]]). Le marché est d'abord un marché de moyenne gamme ([[s1.ligne(P_MOYGAM)]] %)."}
  - {texte: "Portée des résultats. Échantillon par quotas non probabiliste, quotas professionnels manqués (BTP : [[t2.realise(4)]] fiches pour [[t2.prevu(4)]] prévues ; PME : [[t2.realise(2)]] pour [[t2.prevu(2)]]) : les résultats décrivent les [[base.retenues]] acheteurs interrogés, pas le marché national."}
  - {texte: "Schneider en tête, Yaki en surprise. Schneider est la marque la plus achetée ([[s1.ligne(P_SCHNEI)]] % des acheteurs, n = [[s1.n(P_SCHNEI)]]). Yaki, absente de la liste du questionnaire, arrive deuxième ([[s1.ligne(P_YAKI)]] %)."}
  - {tableau: "S1", id: s1, titre: "Chiffres clés", source: "enquête EDM équipements électriques, octobre 2026 (N08_A_RAPPORT_427.sps:80-85)", source_affichee: "enquête EDM équipements électriques, octobre 2026",
     procedure: indicateurs, arguments: {variables: [P_DECU, P_CONTREF, P_QUAL, P_REFUS10, P_MOYGAM, P_SCHNEI, P_YAKI, P_GARREM, P_GROSSI, P_ONLINE], ic95: true}}

  # ------------------------------------------------------------------------------------------- I. introduction (p. 7-9)
  - {section: "I. Introduction", niveau: 1}
  - {section: "A. Contexte de l'étude", niveau: 2}
  - {texte: "Le marché camerounais de la distribution de matériels et d'équipements électriques est porté par l'urbanisation, l'industrialisation et les projets d'infrastructures. Douala, Yaoundé et Bafoussam en représentent les principaux pôles de consommation."}
  - {texte: "L'offre y est très diversifiée : grands fabricants européens (Schneider, Legrand, Hager, ABB, Siemens, Philips), fabricants asiatiques (Chint, Growatt, JA Solar, Longi) et un grand nombre de marques non référencées, souvent importées sans traçabilité claire. Elle est distribuée par des importateurs, des grossistes spécialisés, des quincailleries, des magasins spécialisés et les marchés."}
  - {texte: "Les comportements d'achat, les préférences de marques et le rôle de l'origine des produits (Europe, Asie, Amérique) restent pourtant peu documentés. Les acteurs du secteur ne disposent pas de données quantitatives fiables pour orienter leur offre, leurs prix et leurs canaux de distribution."}
  - {texte: "C'est dans ce contexte que M2B Conseils SA a commandité une étude de marché quantitative sur la distribution du matériel et des équipements électriques à Douala, Yaoundé et Bafoussam. Elle doit fournir au promoteur les données nécessaires à une décision d'installation sur ce marché."}
  - {section: "B. Objectifs de l'étude", niveau: 2}
  - {texte: "Le principal objectif de cette étude de marché est de déterminer les habitudes de consommation, les préférences de marques et d'origine des produits, ainsi que les attentes des clients en matière de distribution de matériels et d'équipements électriques dans les villes de Douala, Yaoundé et Bafoussam."}
  - {section: "C. Cadre de la mission", niveau: 2}
  - {texte: "La mission s'opère dans le cadre du cahier des charges établi par M2B Conseils SA pour une « Étude de marché quantitative sur la distribution du matériel et des équipements électriques au Cameroun (Douala, Yaoundé, Bafoussam) », pour le compte du promoteur souhaitant s'installer sur ce marché."}
  - {texte: "Limites de l'étude. L'étude est quantitative et déclarative : elle mesure ce que [[base.retenues]] acheteurs disent acheter, payer et attendre ; elle ne mesure ni les volumes vendus, ni la taille du marché, qui doivent être établis par une recherche documentaire (statistiques douanières) et un audit des points de vente."}

  # ------------------------------------------------------------------------------------------- II. déroulement (p. 10-19)
  - {section: "II. Déroulement de l'étude", niveau: 1}
  - {section: "A. Méthodologie", niveau: 2}
  - {texte: "En vertu de la méthode des quotas et afin d'avoir une bonne représentativité des entreprises à enquêter, plusieurs cibles ont été retenues pour cette enquête et le tableau 1 en donne la catégorisation :"}
  - {tableau: "1", id: t1, titre: "Ciblage", source: "cahier des charges de l'étude", source_affichee: "cahier des charges de l'étude",
     contenu: [["Distributeurs", "Prescripteurs", "Utilisateurs finaux"],
               ["Revendeurs / grossistes ; distributeurs de matériel électrique", "Électriciens / artisans ; entreprises du BTP",
                "Particuliers (ménages) ; entreprises (PME, industries)"]]}
  - {texte: "La taille de l'échantillon prévue par le cahier des charges est de [[t2.prevu_total]] enquêtés répartis sur cinq profils et trois familles de cibles. Les ressources déployées ont permis d'atteindre [[t2.taux]] % des objectifs visés, soit [[t2.realise_total]] questionnaires collectés : [[g1.base]] à Douala, [[g4.base]] à Yaoundé et [[g6.base]] à Bafoussam. Après contrôle de qualité, [[base.retenues]] fiches ont été retenues pour l'analyse (voir partie III.A). Le tableau 2 suivant présente la répartition des questionnaires collectés par cible et par ville."}
  - {tableau: "2", id: t2, titre: "Fréquence des cibles interrogées", source: "enquête EDM EE, oct. 2026 ; quotas : plan d'échantillonnage, version 02", source_affichee: "enquête EDM EE, oct. 2026 ; quotas : plan d'échantillonnage, version 02",
     procedure: quotas_realises, arguments: {cible: VOUSETES, ville: VILLEREG, prevu: "@quotas"}, base: collecte}
  - {texte: "Point de vigilance – portée des résultats. Échantillonnage par quotas non probabiliste : les quotas ont organisé le travail de terrain ; ils ne décrivent pas, et ne pondèrent pas, la structure réelle du marché."}
  - {texte: "Quotas réalisés très différents du plan : particuliers [[t2.realise(1)]] fiches pour [[t2.prevu(1)]] prévues ([[t2.atteinte(1)]] %), revendeurs [[t2.realise(5)]] pour [[t2.prevu(5)]] ([[t2.atteinte(5)]] %), électriciens [[t2.realise(3)]] pour [[t2.prevu(3)]] ([[t2.atteinte(3)]] %), PME [[t2.realise(2)]] pour [[t2.prevu(2)]] ([[t2.atteinte(2)]] %), BTP [[t2.realise(4)]] pour [[t2.prevu(4)]] ([[t2.atteinte(4)]] %)."}
  - {texte: "Conséquences : les totaux sont tirés par les particuliers et les revendeurs ; les entreprises du BTP sont regroupées avec les PME et ne sont jamais commentées seules ; les résultats par maillon (utilisateurs finaux, prescripteurs, distributeurs) et par ville sont plus robustes que les totaux."}
  - {texte: "Pas de pondération : redresser l'échantillon sur les quotas du cahier des charges aurait reproduit le plan de travail, pas la population. Les marges d'erreur ne s'interprètent donc que comme des repères (voir la note de lecture) ; un test de sensibilité (tableau 2 bis) en mesure la portée."}
  - {texte: "Les résultats dépendent-ils de la composition de l'échantillon ? Pour le vérifier, les chiffres clés ont été recalculés en redonnant le même poids à chaque profil (quatre groupes, PME et BTP réunis), puis à chaque maillon, puis à chaque ville. Aucun indicateur ne varie de plus de [[t2bis.ecart_max]] points. Seule la place de Yaki dépend sensiblement du poids des revendeurs (de [[t2bis.ligne_min(P_YAKI)]] à [[t2bis.ligne_max(P_YAKI)]] % des acheteurs selon la pondération)."}
  - {tableau: "2 bis", id: t2bis, titre: "Sensibilité des chiffres clés à la composition de l'échantillon", source: "base d'analyse (N08_A_RAPPORT_427.sps:88-116)", source_affichee: "base d'analyse, calculs M2B",
     procedure: sensibilite, arguments: {variables: [P_DECU, P_CONTREF, P_QUAL, P_REFUS10, P_MOYGAM, P_SCHNEI, P_YAKI, P_GARREM, P_GROSSI, P_ONLINE],
                                         ponderations: {"Profils égaux": W_PROF, "Maillons égaux": W_MAIL, "Villes égales": W_VILL}}}
  - {figure: "1", id: g1, titre: "Fréquences / familles de cibles interrogées pour la ville de DOUALA", source: "N08_B_COLLECTE_446.sps:30-33",
