  - {texte: "Note de lecture : base : n = [[circuits.base]] (circuits) et [[marques.base]] (marques). « Dont [[circuits_profil.col(5|2)]] % des entreprises » : part des entreprises qui achètent d'abord chez un importateur. Les marques n'ont pas été croisées avec les circuits : leur placement en regard d'un circuit est indicatif."}
