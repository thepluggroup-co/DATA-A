  - {calcul: marque_prix, procedure: tri_croise, arguments: {ligne: MARQUE_G, colonne: PRCRICHO}, source: "N08_A_RAPPORT_427.sps:223-224"}
  - {calcul: valeurs, procedure: parts_bootstrap, source: "N08_A_RAPPORT_427.sps:236-247",
     arguments: {variable: MARQUE_G, poids: DEPENSE_AN, groupes: {Schneider: [1], Chint: [3], Yaki: [5], Legrand: [2], AutresSans: [6, 8, 9], SansMarque: [9]}}}
  - {calcul: valeurs_origine, procedure: parts_bootstrap, source: "N08_A_RAPPORT_427.sps:236-247",
     arguments: {variable: ORIG_MARQ3, poids: DEPENSE_AN, groupes: {Europe: [1], Asie: [2], NonVerifiee: [3]}}}
  - {texte: "À Douala, Yaki ([[g41.pct(Douala|2)]] %) et Schneider ([[g41.pct(Douala|1)]] %) se partagent le marché. À Yaoundé, Schneider ([[g41.pct(Yaoundé|1)]] %) et Legrand ([[g41.pct(Yaoundé|4)]] %) réunissent plus de six acheteurs sur dix. À Bafoussam, les marques chinoises arrivent en tête ([[g42.pct(Bafoussam|3)]] %), devant Schneider ([[g42.pct(Bafoussam|1)]] %), et un acheteur sur six n'a pas de marque fixe ([[marque_ville.col(9|3)]] %)."}
  - {texte: "Les électriciens, prescripteurs, achètent Schneider ou Legrand à [[marque_prof.col(1,2|3)]] %. Chint réunit [[marque_prix.col(3|1)]] % des acheteurs qui choisissent d'abord sur le prix. Yaki, à l'inverse, est d'abord la marque des revendeurs ([[marque_prof.col(5|4)]] % d'entre eux), ce qui suggère un produit poussé par la distribution plus que demandé par les installateurs."}
  - {texte: "En valeur, les estimations sont trop imprécises pour classer finement les marques : Schneider ([[valeurs.bas(Schneider)]] à [[valeurs.haut(Schneider)]] % de la dépense estimée) et Chint ([[valeurs.bas(Chint)]] à [[valeurs.haut(Chint)]] %) font jeu égal. Yaki semble peser moins en valeur qu'en volume ([[valeurs.bas(Yaki)]] à [[valeurs.haut(Yaki)]] %), et les acheteurs sans marque fixe pourraient peser davantage dans la dépense ([[valeurs.bas(SansMarque)]] à [[valeurs.haut(SansMarque)]] %) que dans le nombre d'acheteurs ([[marques.pct(9)]] %) : c'est une tendance, pas un résultat établi."}
  - {calcul: carte_profil, procedure: correspondances, arguments: {ligne: MARQ_AC, colonne: PROFIL4}, source: "N08_A_RAPPORT_427.sps:230-233"}
  - {figure: "43", id: g43, titre: "Carte des marques achetées le plus souvent, par ville (analyse des correspondances)", source: "N08_A_RAPPORT_427.sps:226-229",
     procedure: correspondances, arguments: {ligne: MARQ_AC, colonne: VILLEREG, inverser_axes: [1]}, forme: carte}
  - {texte: "La carte des marques (graphique 43) résume les écarts entre villes. Le premier axe, qui porte [[g43.axe(1)]] % de l'information, oppose Douala, tirée par Yaki, à Bafoussam, où dominent les marques chinoises et l'achat sans marque fixe ; le second ([[g43.axe(2)]] %) isole Yaoundé et Legrand. Schneider, proche du centre, est la seule marque présente partout. La ville structure le choix de marque [[g43.inertie_sur(carte_profil)]] fois plus que le profil de l'acheteur (inertie de [[g43.inertie]] contre [[carte_profil.inertie]]) : un nouvel entrant affronte trois marchés concurrentiels distincts, et doit construire son assortiment ville par ville avant de le construire profil par profil."}
  - {texte: "Note de lecture : une marque proche d'une ville y est sur-représentée (par exemple Yaki à Douala : [[g41.pct(Douala|2)]] % des acheteurs, contre [[marques.pct(5)]] % en moyenne). La carte se lit par direction depuis le centre, pas en distance exacte entre points. Calcul : analyse des correspondances (équivalent SPSS CORRESPONDENCE), normalisation symétrique ; le sens d'un axe est arbitraire, le premier axe est orienté comme dans la sortie SPSS."}
  - {texte: "Par profil, la carte des marques est beaucoup moins structurée (inertie de [[carte_profil.inertie]]). Son premier axe ([[carte_profil.axe(1)]] % de l'information) oppose les électriciens et les entreprises, tournés vers Schneider ([[marque_prof.col(1|3)]] % des électriciens) et Legrand ([[marque_prof.col(2|3)]] %), aux revendeurs et aux particuliers, portés par Yaki ([[marque_prof.col(5|4)]] % des revendeurs) et Chint ([[marque_prof.col(3|1)]] % des particuliers). La prescription pousse donc les marques européennes, la distribution pousse Yaki : un distributeur qui veut vendre aux deux devra tenir les deux registres."}
  - {texte: "Les parts estimées dans l'échantillon (volume = part des acheteurs ; valeur = part de la dépense annuelle estimée) des principales marques sont les suivantes :"}
  - {texte: "Schneider [[marques.pct(1)]] % des acheteurs (valeur : [[valeurs.bas(Schneider)]] à [[valeurs.haut(Schneider)]] %)"}
  - {texte: "Yaki [[marques.pct(5)]] % des acheteurs (valeur : [[valeurs.bas(Yaki)]] à [[valeurs.haut(Yaki)]] %)"}
  - {texte: "Chint / chinoises [[marques.pct(3)]] % des acheteurs (valeur : [[valeurs.bas(Chint)]] à [[valeurs.haut(Chint)]] %)"}
  - {texte: "Legrand [[marques.pct(2)]] % des acheteurs (valeur : [[valeurs.bas(Legrand)]] à [[valeurs.haut(Legrand)]] %)"}
  - {texte: "Les autres marques non référencées et les achats sans marque fixe représentent [[marques.pct(6,8,9)]] % des acheteurs et de [[valeurs.bas(AutresSans)]] à [[valeurs.haut(AutresSans)]] % de la dépense estimée. Par origine, les marques européennes pèsent [[g9.pct(1)]] % des acheteurs et de [[valeurs_origine.bas(Europe)]] à [[valeurs_origine.haut(Europe)]] % de la dépense estimée, les marques asiatiques [[g9.pct(2)]] % et de [[valeurs_origine.bas(Asie)]] à [[valeurs_origine.haut(Asie)]] %, les marques d'origine non vérifiée ou sans marque fixe [[g9.pct(3)]] % et de [[valeurs_origine.bas(NonVerifiee)]] à [[valeurs_origine.haut(NonVerifiee)]] %. Ces fourchettes (base : [[valeurs.base]] acheteurs ; point milieu des tranches de montant déclarées ; méthode du bootstrap, [[lit:1 000]] tirages) sont un repère indicatif sous hypothèse d'échantillonnage aléatoire, non représentatif du plan par quotas : elles fixent des ordres de grandeur, pas des parts de marché."}
  - {section: "Quelques pratiques courantes du marché", niveau: 4}
  - {figure: "44", id: g44, titre: "Moyen de paiement habituel", source: "N08_A_RAPPORT_427.sps:253-254", procedure: frequences, arguments: {variable: PAIEPRIV}, forme: secteurs}
  - {texte: "Le moyen de paiement le plus couramment utilisé avec les fournisseurs de matériel électrique est le paiement en espèces ([[g44.pct(1)]] %), c'est-à-dire que la commande est directement payée au comptant. Le Mobile Money ([[g44.pct(2)]] %) et le virement ([[g44.pct(3)]] %) restent minoritaires."}
  - {figure: "45", id: g45, titre: "Moyen de paiement habituel, par profil", source: "N08_A_RAPPORT_427.sps:253-255",
     procedure: tri_croise, arguments: {ligne: PAIEPRIV, colonne: PROFIL4}, forme: groupees}
  - {calcul: paiement_ville, procedure: tri_croise, arguments: {ligne: PAIEPRIV, colonne: VILLEREG}, source: "N08_A_RAPPORT_427.sps:255"}
  - {texte: "Le virement et le crédit fournisseur sont surtout utilisés par les entreprises ([[g45.col(3|2)]] % et [[g45.col(4|2)]] %). Bafoussam utilise davantage le Mobile Money ([[paiement_ville.col(2|3)]] %) et le virement ([[paiement_ville.col(3|3)]] %). Le crédit fournisseur ne concerne que [[g44.pct(4)]] % des acheteurs. La durée du crédit fournisseur accordé n'a pas été mesurée par le questionnaire ; elle est à documenter auprès des grossistes."}
  - {section: "b) Analyse comparative des principales marques", niveau: 4}
  - {texte: "Le tableau suivant présente une analyse comparative des marques les plus représentatives présentes sur le territoire national."}
  - {calcul: levier_profil, procedure: tri_croise, arguments: {ligne: LEVFIDEL, colonne: PROFIL4}, source: "N08_A_RAPPORT_427.sps:213-214"}
  - {tableau: "10", id: t10, titre: "Analyse comparative des marques de forte présence au Cameroun", source: "enquête EDM EE, oct. 2026 (N08_A_RAPPORT_427.sps:136-137, 213-214, 236-247, 260-261, 293-295)",
     contenu: [["Éléments comparatifs", "Schneider", "Legrand", "Chint / chinoises", "Yaki", "Autres non réf."],
               ["Groupe", "Marques européennes", "Marques européennes", "Marques asiatiques et non référencées", "Marques asiatiques et non référencées", "Marques asiatiques et non référencées"],
               ["Origine / positionnement", "Europe – marque de référence", "Europe – marque de référence", "Asie – prix", "Origine non vérifiée", "Origine non vérifiée"],
               ["Part des acheteurs (n = [[marques.base]])", "[[marques.pct(1)]] %", "[[marques.pct(2)]] %", "[[marques.pct(3)]] %", "[[marques.pct(5)]] %", "[[marques.pct(6,8,9)]] %"],
               ["Part de la dépense estimée (fourchette, n = [[valeurs.base]])", "[[valeurs.bas(Schneider)]]–[[valeurs.haut(Schneider)]] %", "[[valeurs.bas(Legrand)]]–[[valeurs.haut(Legrand)]] %", "[[valeurs.bas(Chint)]]–[[valeurs.haut(Chint)]] %", "[[valeurs.bas(Yaki)]]–[[valeurs.haut(Yaki)]] %", "[[valeurs.bas(AutresSans)]]–[[valeurs.haut(AutresSans)]] %"],
               ["Politique de prix", "Grille attendue d'un disjoncteur : < [[lit:5 000]] FCFA (bas), [[lit:5 000]] – [[lit:15 000]] FCFA (moyen), [[lit:15 000]] – [[lit:40 000]] FCFA (haut). Les marques européennes occupent le haut de la grille, les marques asiatiques et non référencées le bas.", "", "", "", ""],
               ["Stratégie de distribution", "Marques européennes : grossistes spécialisés et importateurs, prescription par les électriciens ([[marque_prof.col(1,2|3)]] % achètent Schneider ou Legrand). Marques asiatiques et non référencées : marchés, quincailleries, Bafoussam.", "", "", "", ""],
               ["Politique promotionnelle", "Contact en personne ([[contact.pct(1)]] %) et WhatsApp ([[contact.pct(3)]] %) ; prix et promotions, premier levier de fidélité ([[g40.pct(1)]] %) ; qualité constante, levier des entreprises ([[levier_profil.col(2|2)]] %) ; e-mail et réseaux sociaux marginaux.", "", "", "", ""],
               ["Problèmes rencontrés", "Contrefaçon : [[crainte_origine.col(1|1)]] % des acheteurs de marques européennes la craignent souvent ; déceptions fréquentes ([[g38.pct(DEJDECAC|1)]] % plusieurs fois).", "", "", "", ""]]}
  - {texte: "Note de lecture : base : n = [[marques.base]] acheteurs ([[valeurs.base]] pour la dépense). Les quatre dernières lignes valent pour l'ensemble des marques."}
  - {section: "Appréhension sur l'origine des matériels et équipements électriques", niveau: 4}
  - {calcul: origine_pref, procedure: frequences, arguments: {variable: ORIGPRIV}, source: "N08_A_RAPPORT_427.sps:258"}
  - {figure: "46", id: g46, titre: "Origine privilégiée à l'achat, par ville", source: "N08_A_RAPPORT_427.sps:257-259",
     procedure: tri_croise, arguments: {ligne: ORIGPRIV, colonne: VILLEREG}, forme: groupees}
  - {texte: "Afin de mieux comprendre les préférences des acheteurs et leurs appréhensions sur l'origine des produits (Europe, Asie, Amérique), une analyse comparative a été réalisée. [[origine_pref.pct(4)]] % des répondants n'ont pas de préférence d'origine ; l'Europe ([[origine_pref.pct(1)]] %) et l'Asie ([[origine_pref.pct(2)]] %) font jeu égal. La carte est pourtant très contrastée : Yaoundé est pro-européenne ([[g46.col(1|2)]] %), Bafoussam pro-asiatique ([[g46.col(2|3)]] %) et Douala indifférente ([[g46.col(4|1)]] % sans préférence)."}
  - {figure: "47", id: g47, titre: "Origine jugée la meilleure en qualité et en prix", source: "N08_A_RAPPORT_427.sps:257-258",
     procedure: batterie, arguments: {variables: [MEQUAFIA, MEILPRIX]}, forme: groupees}
  - {calcul: qualite_avis, procedure: frequences, arguments: {variable: MEQUA_AV}, source: "N08_A_RAPPORT_427.sps:258"}
  - {calcul: prix_avis, procedure: frequences, arguments: {variable: MEILP_AV}, source: "N08_A_RAPPORT_427.sps:258"}
  - {calcul: dilemme, procedure: frequences, arguments: {variable: DILEMME}, source: "N08_A_RAPPORT_427.sps:258"}
  - {texte: "Sur l'ensemble des répondants, l'Europe est jugée meilleure en qualité et fiabilité par [[g47.pct(MEQUAFIA|1)]] % d'entre eux et l'Asie meilleure en prix par [[g47.pct(MEILPRIX|2)]] % ; un sur quatre n'a pas d'avis ([[g47.pct(MEQUAFIA|98)]] % et [[g47.pct(MEILPRIX|98)]] %). Parmi ceux qui ont un avis, l'image est tranchée (Europe [[qualite_avis.pct(1)]] % en qualité, Asie [[prix_avis.pct(2)]] % en prix) et [[dilemme.pct(1)]] % associent à la fois l'Europe à la qualité et l'Asie au prix : ils attendent une qualité vérifiable à un prix intermédiaire."}
  - {section: "c) Analyse qualitative", niveau: 4}
  - {texte: "La distribution de matériel électrique au Cameroun repose largement sur l'importation. Les grossistes spécialisés et les importateurs constituent le cœur du circuit ; ils approvisionnent les quincailleries, les magasins spécialisés et les marchés, où s'approvisionnent les particuliers."}
  - {texte: "On note également la présence de nombreuses marques non référencées, dont l'origine et la conformité sont difficiles à vérifier par l'acheteur. Leur prix bas en fait la référence du bas de gamme et des gros volumes d'achat."}
  - {texte: "Les procédures de contrôle de la conformité avant embarquement (PECAE) pilotées par l'ANOR encadrent les importations de produits réglementés. Le statut exact de chaque famille de matériel électrique au regard de ce programme doit être confirmé auprès de l'ANOR."}
  - {texte: "Les marques européennes de référence sont les plus exposées à la contrefaçon : [[crainte_origine.col(1|1)]] % de leurs acheteurs craignent souvent d'acheter un produit contrefait, contre [[crainte_origine.col(1|2)]] % pour les marques asiatiques. Une explication plausible : le succès d'une marque attire sa contrefaçon."}
  - {texte: "Note de lecture : la crainte déclarée mesure une perception, pas un taux de contrefaçon constaté. Seul un audit d'échantillons, de factures et de circuits d'approvisionnement permettrait d'objectiver le risque par marque."}
  - {texte: "Sur le segment du solaire et des onduleurs, les marques asiatiques (Growatt, JA Solar, Longi) sont présentes ; ce segment reste une niche ([[g11.pct(PRACSOLA)]] % des acheteurs) mais concerne [[q9_entreprises.pct(PRACSOLA)]] % des entreprises."}

  # ------------------------------------------------------------------------------------------- III.B.4 nouveau distributeur (p. 48-51)
  - {section: "4) Appréhension de la venue d'un nouveau distributeur de matériels et équipements électriques sur le marché local", niveau: 3}
  - {section: "a) Appréhension d'un nouveau distributeur", niveau: 4}
  - {figure: "48", id: g48, titre: "Disposition à payer plus cher pour un bon service après-vente", source: "N08_A_RAPPORT_427.sps:196-197",
     procedure: frequences, arguments: {variable: BOSAPACH}, forme: secteurs}
  - {texte: "Le questionnaire ne mesure pas directement l'accueil d'un nouveau distributeur. Plusieurs indicateurs montrent cependant une ouverture à une offre mieux servie : [[g48.pct(1,2)]] % des répondants paieraient (oui) ou pourraient payer (peut-être) plus cher pour un bon service, et [[g38.pct(FIMEFOUR|4,5)]] % changent régulièrement de fournisseur (rarement ou jamais fidèles). La porte est ouverte ; reste à savoir à quel prix on la franchit."}
  - {figure: "49", id: g49, titre: "Critère de choix du canal d'achat (attentes vis-à-vis d'un distributeur)", source: "N08_A_RAPPORT_427.sps:265-266",
     procedure: frequences, arguments: {variable: CRCHCANA}}
  - {calcul: critere_profil, procedure: tri_croise, arguments: {ligne: CRCHCANA, colonne: PROFIL4}, source: "N08_A_RAPPORT_427.sps:267"}
  - {texte: "Sur la question des critères de choix d'un canal ou d'un fournisseur, plusieurs critères ressortent : le prix ([[g49.pct(2)]] %), la largeur du choix ([[g49.pct(3)]] %), la confiance ([[g49.pct(6)]] %), la proximité ([[g49.pct(1)]] %) et la disponibilité ([[g49.pct(4)]] %). Les entreprises choisissent d'abord sur la confiance ([[critere_profil.col(6|2)]] %)."}
  - {figure: "50", id: g50, titre: "Durée de garantie jugée acceptable", source: "N08_A_RAPPORT_427.sps:269-270", procedure: frequences, arguments: {variable: DUGAJUAC}, forme: secteurs}
  - {texte: "La population cible interrogée attend une garantie de [[lit:6]] mois à [[lit:1]] an ([[g50.pct(2)]] %) ou de moins de [[lit:6]] mois ([[g50.pct(1)]] %) ; seuls [[g50.pct(3,4)]] % attendent plus d'un an. L'attente porte sur la certitude d'un remplacement rapide plus que sur une garantie longue, et elle varie fortement selon la ville (détail ci-dessous)."}
  - {calcul: garantie_ville, procedure: tri_croise, arguments: {ligne: DUGAJUAC, colonne: VILLEREG}, source: "N08_A_RAPPORT_427.sps:271"}
  - {calcul: garantie_profil, procedure: tri_croise, arguments: {ligne: DUGAJUAC, colonne: PROFIL4}, source: "N08_A_RAPPORT_427.sps:271"}
  - {calcul: kw_garantie, procedure: kruskal_wallis, arguments: {variable: DUGAJUAC, groupe: PROFIL4}, source: "N08_A_RAPPORT_427.sps:127"}
  - {calcul: enq_duree, procedure: tri_croise, arguments: {ligne: DUGAJUAC, colonne: ENQ_DLA}, source: "N08_A_RAPPORT_427.sps:279-281"}
  - {calcul: enq_garantie, procedure: tri_croise, arguments: {ligne: GARANT_1AN, colonne: ENQ_DLA}, source: "N08_A_RAPPORT_427.sps:279-281"}
  - {calcul: enq_sav, procedure: tri_croise, arguments: {ligne: SAV_PASIMP, colonne: ENQ_DLA}, source: "N08_A_RAPPORT_427.sps:279-281"}
  - {calcul: sav_ville, procedure: tri_croise, arguments: {ligne: IMSECSAV, colonne: VILLEREG}, source: "N08_A_RAPPORT_427.sps:122-126"}
  - {texte: "Une garantie à moduler par ville. La durée attendue varie fortement selon la ville (V = [[garantie_ville.v]], p [[garantie_ville.p_txt]]) : [[garantie_ville.col(1|3)]] % des acheteurs de Bafoussam se contentent de moins de [[lit:6]] mois, [[garantie_ville.col(2|2)]] % de ceux de Yaoundé attendent [[lit:6]] mois à [[lit:1]] an, tandis qu'à Douala les réponses semblent se polariser ([[garantie_ville.col(1|1)]] % moins de [[lit:6]] mois, [[garantie_ville.col(3,4|1)]] % plus d'un an). Cette polarisation tient à un seul enquêteur (ENQ1) : [[enq_garantie.col(1|1)]] % de ses fiches demandent plus d'un an, contre [[enq_garantie.col(1|2)]] % pour les autres enquêteurs de la ville, chez qui [[enq_duree.col(1|2)]] % se contentent de moins de [[lit:6]] mois. Selon le profil, l'écart n'est qu'une tendance (khi-deux non significatif, p [[garantie_profil.p_txt]] ; Kruskal-Wallis p [[kw_garantie.p_txt]]) : les particuliers se contentent plus souvent de moins de [[lit:6]] mois ([[garantie_profil.col(1|1)]] %), les électriciens attendent davantage ([[garantie_profil.col(2|3)]] % entre [[lit:6]] mois et [[lit:1]] an, [[garantie_profil.col(3,4|3)]] % plus d'un an)."}
  - {texte: "Note de lecture : un contrôle par enquêteur confirme un effet enquêteur à Douala, sur la base d'analyse comme sur la base de collecte. L'enquêteur ENQ1 ([[enq_garantie.ncol(1)]] fiches retenues à Douala) obtient [[enq_garantie.col(1|1)]] % de demandes de garantie de plus d'un an et [[enq_sav.col(1|1)]] % de SAV jugé « pas important », contre [[enq_garantie.col(1|2)]] % et [[enq_sav.col(1|2)]] % pour les autres enquêteurs de Douala (Yaoundé : [[sav_ville.col(4|2)]] % de SAV « pas important »). Les résultats de Douala sur la garantie et l'importance du SAV sont donc à lire avec réserve."}
