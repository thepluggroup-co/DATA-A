  - {calcul: sav_maillon, procedure: tri_croise, arguments: {ligne: BOSAPACH, colonne: CATEG3}, source: "N08_A_RAPPORT_427.sps:286-287"}
  - {calcul: fidel_maillon, procedure: tri_croise, arguments: {ligne: FIMEFOUR, colonne: CATEG3}, source: "N08_A_RAPPORT_427.sps:286-287"}
  - {texte: "Les attentes diffèrent selon le maillon. Les prescripteurs préfèrent la quincaillerie ([[canal_maillon.col(1|2)]] %) et attendent davantage de conseil technique ([[service_maillon.col(2|2)]] %) ; les distributeurs se tournent vers le grossiste ([[canal_maillon.col(2|3)]] %) et le marché ([[canal_maillon.col(4|3)]] %), sont les moins fidèles ([[fidel_maillon.col(5|3)]] % ne le sont jamais) et les plus réticents à payer un bon SAV ([[sav_maillon.col(3|3)]] % refusent) ; les utilisateurs finaux demandent plus souvent la réparation ou les pièces ([[service_maillon.col(3|1)]] %). Selon le profil, les entreprises choisissent leur fournisseur d'abord sur la confiance ([[critere_profil.col(6|2)]] %), les particuliers et les électriciens plus souvent sur la proximité ([[critere_profil.col(1|1)]] % et [[critere_profil.col(1|3)]] %). Pour un nouvel entrant, cela dessine trois portes d'entrée : la quincaillerie partenaire pour toucher les électriciens, le comptoir de gros pour les revendeurs, et la relation de confiance pour les entreprises."}
  - {texte: "Note de lecture : écarts significatifs selon le maillon pour le canal préféré (V = [[canal_maillon.v]], p [[canal_maillon.p_txt]]), le service attendu (p [[service_maillon.p_txt]]), la disposition à payer le SAV (p [[sav_maillon.p_txt]]) et la fidélité (p [[fidel_maillon.p_txt]]), et selon le profil pour le critère de choix du canal (p [[critere_profil.p_txt]]). Pour le canal et le service, plusieurs cases ont un effectif théorique faible : écarts à lire comme des tendances."}
  - {figure: "54", id: g54, titre: "Type de service souhaité en priorité", source: "N08_A_RAPPORT_427.sps:208-209", procedure: frequences, arguments: {variable: SEATPRIO}, forme: secteurs}
  - {texte: "Sur la question relative au type de service souhaité en priorité de la part d'un fournisseur, la population cible interrogée privilégie la garantie avec remplacement ([[g54.pct(1)]] %), le conseil technique ([[g54.pct(2)]] %) et la réparation ou la fourniture de pièces ([[g54.pct(3)]] %)."}
  - {figure: "55", id: g55, titre: "Canal de contact souhaité avec le fournisseur de matériels électriques", source: "N08_A_RAPPORT_427.sps:293-294",
     procedure: frequences, arguments: {variable: CACOPREF}, forme: secteurs}
  - {calcul: contact_ville, procedure: tri_croise, arguments: {ligne: CACOPREF, colonne: VILLEREG}, source: "N08_A_RAPPORT_427.sps:295"}
  - {calcul: contact_profil, procedure: tri_croise, arguments: {ligne: CACOPREF, colonne: PROFIL4}, source: "N08_A_RAPPORT_427.sps:295"}
  - {texte: "La population interrogée préfère être contactée en personne ([[g55.pct(1)]] %), par WhatsApp ([[g55.pct(3)]] %) ou par téléphone ([[g55.pct(2)]] %). L'e-mail et les réseaux sociaux sont marginaux ([[g55.pct(4)]] % et [[g55.pct(5)]] %). WhatsApp est davantage cité à Douala ([[contact_ville.col(3|1)]] %) et par les entreprises ([[contact_profil.col(3|2)]] %)."}
  - {section: "c) Proposition de positionnement commercial (canal digital)", niveau: 4}
  - {figure: "56", id: g56, titre: "Achat en ligne déjà effectué", source: "N08_A_RAPPORT_427.sps:298-299", procedure: frequences, arguments: {variable: DEJACHLI}, forme: secteurs}
  - {calcul: ligne_experience, procedure: tri_croise, arguments: {ligne: PRETACLI, colonne: DEJACHLI}, source: "N08_A_RAPPORT_427.sps:300"}
  - {texte: "La question du canal digital porte sur l'expérience et la disposition à l'achat en ligne. [[g56.pct(1)]] % des répondants ont déjà acheté du matériel électrique en ligne ; parmi eux, [[ligne_experience.col(1|1)]] % sont prêts à recommencer, contre [[ligne_experience.col(1|2)]] % de ceux qui ne l'ont jamais fait. Le passage à l'achat en ligne semble donc lié à l'expérience plus qu'à la curiosité."}
  - {figure: "57", id: g57, titre: "Disposition à acheter en ligne et principal frein", source: "N08_A_RAPPORT_427.sps:298-299",
     procedure: batterie, arguments: {variables: [PRETACLI, PRFRACLI]}, forme: secteurs}
  - {calcul: achat_ligne, procedure: logistique, source: "N08_A_RAPPORT_427.sps:303-313",
     arguments: {dependante: ONLIN_FERME, explicatives: [VILLEREG, CATEG3, AGE3, SAV_TRESIMP, MONT_100K, DECU], categorielles: [VILLEREG, CATEG3, AGE3]}}
  - {calcul: frein_ville, procedure: tri_croise, arguments: {ligne: PRFRACLI, colonne: VILLEREG}, source: "N08_A_RAPPORT_427.sps:301"}
  - {texte: "[[g57.pct(PRETACLI|1)]] % des répondants sont prêts à acheter en ligne et [[g57.pct(PRETACLI|2)]] % hésitent. Les principaux freins sont le doute sur la qualité ou la conformité ([[g57.pct(PRFRACLI|1)]] %) et le fait de ne pas voir le produit ([[g57.pct(PRFRACLI|2)]] %) : un modèle de commande à distance avec retrait et vérification en magasin y répond. Il s'agit d'une intention déclarée : elle signale un usage de vitrine et de prise de commande à tester, pas un chiffre d'affaires acquis."}
  - {texte: "Qui a l'intention ferme d'acheter en ligne ? Une régression logistique ([[achat_ligne.base]] fiches complètes) isole trois facteurs. À ville, maillon, âge et déception égaux, juger le SAV très important multiplie par [[achat_ligne.or(SAV_TRESIMP)]] les chances d'une intention ferme (intervalle de [[achat_ligne.or_bas(SAV_TRESIMP)]] à [[achat_ligne.or_haut(SAV_TRESIMP)]]) et un panier de [[lit:100 000]] FCFA ou plus par [[achat_ligne.or(MONT_100K)]] ([[achat_ligne.or_bas(MONT_100K)]] à [[achat_ligne.or_haut(MONT_100K)]]) ; Bafoussam est nettement en retrait par rapport à Douala ([[achat_ligne.or(VILLEREG_3)]] ; [[achat_ligne.or_bas(VILLEREG_3)]] à [[achat_ligne.or_haut(VILLEREG_3)]]), Yaoundé n'en diffère pas. Le maillon, l'âge et la déception passée ne jouent pas. Notre lecture : l'acheteur en ligne potentiel n'est pas un « jeune connecté » mais un client exigeant sur le service et à gros panier ; le canal digital doit prolonger le service (devis, disponibilité, suivi), et non servir de canal prix."}
  - {texte: "Note de lecture : le modèle explique peu (R² de Nagelkerke = [[achat_ligne.r2]]) et son ajustement est imparfait (test de Hosmer-Lemeshow, p = [[achat_ligne.hl_p]]) ; les rapports de chances décrivent des facteurs associés, ils ne permettent pas de prédire qui achètera. Les intervalles sont des repères, comme indiqué dans la note de lecture méthodologique."}
  - {texte: "La confiance dans le paiement en ligne est un frein plus marqué à Douala ([[frein_ville.col(3|1)]] %), la livraison à Bafoussam ([[frein_ville.col(4|3)]] %)."}

  # ------------------------------------------------------------------------------------------- III.C environnement (p. 52-53)
  - {section: "C. Analyse de l'environnement", niveau: 2}
  - {section: "1) Cadre réglementaire", niveau: 3}
  - {texte: "Au Cameroun, la qualité des produits importés est encadrée par l'Agence des Normes et de la Qualité (ANOR) à travers le Programme d'Évaluation de la Conformité Avant Embarquement (PECAE) : des organismes agréés évaluent la marchandise et délivrent une attestation de conformité, sur la base de laquelle l'ANOR délivre le certificat de conformité exigé pour le dédouanement des produits réglementés. Le statut de chaque famille de matériel électrique et les normes camerounaises applicables sont à confirmer auprès de l'ANOR."}
  - {section: "2) Analyse externe (opportunités et menaces)", niveau: 3}
  - {texte: "L'analyse externe est une synthèse de l'ensemble des facteurs environnants pouvant influencer, positivement ou négativement, un projet de mise en place d'une unité de distribution de matériels et d'équipements électriques."}
  - {section: "Opportunités", niveau: 4}
  - {texte: "• Une demande de qualité vérifiable insatisfaite : [[s1.ligne(P_DECU)]] % des acheteurs ont déjà été déçus et [[s1.ligne(P_CONTREF)]] % craignent la contrefaçon ; un distributeur capable de garantir l'authenticité et la conformité de ses produits dispose d'un avantage concurrentiel net."}
  - {texte: "• Des professionnels (entreprises, électriciens) à forte dépense, attachés à la qualité et à la marque, et un segment solaire en développement ([[q9_entreprises.pct(PRACSOLA)]] % des entreprises) ; un usage répandu de WhatsApp pour le contact commercial ([[contact.pct(3)]] %, [[contact_ville.col(3|1)]] % à Douala)."}
  - {section: "Menaces", niveau: 4}
  - {calcul: fidele_ville, procedure: tri_croise, arguments: {ligne: FIDELE, colonne: VILLEREG}, source: "N08_A_RAPPORT_427.sps:212-214"}
  - {calcul: fidelite_ville, procedure: tri_croise, arguments: {ligne: FIMEFOUR, colonne: VILLEREG}, source: "N08_A_RAPPORT_427.sps:122-126"}
  - {texte: "Le marché est payé majoritairement en espèces ([[g44.pct(1)]] %), la prime acceptée pour la qualité est faible (+[[surcout_profil.mediane]] % en médiane) et [[meme_canal.pct(1)]] % des clients restent dans leur canal actuel. Les produits contrefaits ou non conformes fixent un prix plancher difficile à concurrencer pour un distributeur qui supporte des coûts d'authentification et de garantie."}
  - {texte: "La fidélité est forte à Yaoundé ([[fidele_ville.col(1|2)]] % de clients fidèles), ce qui rend la conquête plus longue ; à l'inverse, la faible fidélité de Douala ([[fidelite_ville.col(5|1)]] % jamais fidèles) facilite la conquête mais complique la rétention."}

  # ------------------------------------------------------------------------------------------- IV. conclusion (p. 54-55)
  - {section: "IV. Conclusion", niveau: 1, role: conclusions}
  - {texte: "Cette étude visait à décrire les habitudes d'achat, les préférences de marques et d'origine, et les attentes des acheteurs de matériel électrique à Douala, Yaoundé et Bafoussam. Elle repose sur [[base.collectees]] questionnaires recueillis du [[lit:5]] au [[lit:8]] octobre [[lit:2026]], dont [[base.retenues]] retenus après contrôle de qualité. Trois enseignements s'en dégagent."}
  - {texte: "Une confiance déçue. [[s1.ligne(P_DECU)]] % des acheteurs ont déjà été déçus par un achat, [[s1.ligne(P_CONTREF)]] % craignent d'acheter un produit contrefait ou non conforme, et le doute sur la qualité est le premier frein à l'achat ([[g38.pct(PRINFREI|2)]] %), à égalité avec le prix ([[g38.pct(PRINFREI|1)]] %)."}
  - {texte: "Une qualité exigée, mais pas payée. La qualité est le premier critère de choix ([[s1.ligne(P_QUAL)]] %), mais le marché est d'abord de moyenne gamme ([[s1.ligne(P_MOYGAM)]] %) et [[s1.ligne(P_REFUS10)]] % des acheteurs refusent de payer plus de [[lit:10]] % pour monter en gamme (+[[surcout_profil.mediane]] % en médiane)."}
  - {texte: "Un marché tenu par le grossiste. Le grossiste spécialisé est le premier lieu d'achat ([[circuits.pct(2)]] %) ; les achats sont fréquents ([[frequence.pct(1,2)]] % au moins une fois par mois) et payés en espèces ([[g44.pct(1)]] %). Schneider est la marque la plus achetée ([[marques.pct(1)]] %), devant Yaki ([[marques.pct(5)]] %), absente de la liste du questionnaire et diffusée par les revendeurs."}
  - {texte: "Notre lecture : ces constats ouvrent un espace pour un distributeur de confiance, qui vend des produits de moyenne gamme dont l'authenticité et la conformité sont garanties, au prix du marché, avec remplacement en cas de défaut. La partie V en détaille les conditions."}
  - {texte: "Limites. Ces résultats décrivent les [[base.retenues]] acheteurs interrogés selon un échantillon par quotas, dans lequel les entreprises du BTP sont peu représentées ([[t2.realise(4)]] fiches pour [[t2.prevu(4)]] prévues). Ils ne mesurent ni la taille du marché ni les volumes vendus : ces deux éléments restent à établir par les statistiques douanières et un audit des points de vente."}

  # ------------------------------------------------------------------------------------------- V. recommandations (p. 56-62)
  - {section: "V. Recommandations", niveau: 1, role: recommandations}
  - {texte: "DÉCISION PROPOSÉE : autoriser une phase de validation commerciale et fournisseur, et non encore un déploiement national."}
  - {texte: "▪ Démarrer par un pilote commercial comparatif à Douala et à Yaoundé, avec un assortiment resserré, un stock fiable et une garantie écrite ; couvrir Bafoussam par des revendeurs partenaires."}
  - {texte: "▪ Conditionner le déploiement à quatre vérifications : audit des prix et des stocks concurrents ; vérification de l'origine et de la conformité des références ; conditions fournisseurs confirmées ; modèle de marge intégrant garanties, retours, ruptures et besoin en fonds de roulement."}
  - {texte: "▪ Juger le pilote sur des indicateurs fixés à l'avance : ventes par référence, marge nette après retours et garanties, taux de rupture, conversion des devis, réachat à [[lit:30]] et [[lit:60]] jours, délai de livraison et coût d'acquisition client."}
  - {section: "A. Recommandations stratégiques", niveau: 2}
  - {texte: "Les résultats de l'enquête conduisent à recommander un positionnement de « distributeur de confiance » : un spécialiste du matériel électrique de moyenne gamme dont l'authenticité, la conformité et le remplacement en cas de défaut sont garantis, à un prix aligné sur le marché. Ce positionnement répond au premier problème du marché ([[s1.ligne(P_DECU)]] % des acheteurs déçus, [[s1.ligne(P_CONTREF)]] % craignant la contrefaçon) sans exiger des clients une prime de prix qu'ils refusent (+[[surcout_profil.mediane]] % en médiane). Condition de validation : vérifier par le pilote que les acheteurs choisissent effectivement un distributeur qui documente ses produits, à prix de marché (conversion, réachat), et que la marge couvre les garanties et les retours."}
  - {section: "1. Cibles prioritaires", niveau: 3}
  - {texte: "Priorité [[lit:1]], les professionnels : électriciens et artisans, prescripteurs des achats des particuliers ([[marque_prof.col(1,2|3)]] % achètent Schneider ou Legrand, [[marque_profil.col(1,2|3)]] % jugent la marque importante), et entreprises, plus gros acheteurs (dépense annuelle médiane de [[depense_profil.groupe_mediane_millions(2)]] millions FCFA, choix du fournisseur d'abord sur la confiance pour [[critere_profil.col(6|2)]] %, surcoût accepté de +[[surcout_profil.groupe(2)]] %). Condition de validation : confirmer en pilote la part des ventes aux professionnels et leur panier réel ; les dépenses citées sont des estimations."}
  - {texte: "Priorité [[lit:2]], les revendeurs et grossistes : un volume régulier ([[frequence_profil.col(1|4)]] % achètent chaque semaine) mais une forte sensibilité au prix ([[g36.col(3|4)]] % refusent de payer plus pour un meilleur service, [[levier_profil.col(1|4)]] % citent le prix comme premier levier de fidélité). Ce sont eux qui ont fait le succès de Yaki ([[marque_prof.col(5|4)]] % l'achètent le plus souvent) : ils doivent être servis par une offre de gros avec remises sur volume, capable de rivaliser avec cette marque. Condition de validation : fixer les remises à partir de la marge réelle mesurée, et non avant chiffrage."}
  - {texte: "Priorité [[lit:3]], les particuliers : touchés par les électriciens qui les conseillent, par les revendeurs partenaires et directement au point de vente."}
  - {section: "2. Séquence géographique", niveau: 3}
  - {texte: "Douala en premier : la ville achète le plus souvent ([[g32.col(1|1)]] % d'achats hebdomadaires), est la moins fidèle ([[fidelite_ville.col(5|1)]] % jamais fidèles) et la plus ouverte aux nouvelles marques : Yaki, absente des listes du questionnaire, y est devenue la première marque ([[g41.pct(Douala|2)]] % des acheteurs). Condition de validation : audit des loyers, de la concurrence (dont Yaki), des coûts logistiques et des conditions fournisseurs."}
  - {texte: "Yaoundé en parallèle ou en second, selon la capacité de lancement : la dépense médiane par acheteur y est équivalente à celle de Douala ([[depense_ville.groupe_mediane_millions(2)]] millions FCFA ; écart non significatif, Mann-Whitney p [[depense_dla_yde.p_txt]]), le marché est pro-européen ([[g46.col(1|2)]] % préfèrent l'Europe ; Schneider et Legrand réunissent plus de six acheteurs sur dix) et plus tolérant au surcoût (+[[surcout_ville.groupe(2)]] %). Sa fidélité ([[fidele_ville.col(1|2)]] %) rendra la conquête plus lente : elle passera par le conseil technique ([[g39.col(2|2)]] % le demandent en priorité). Si les moyens le permettent, une ouverture simultanée avec Douala est défendable ; sinon, Yaoundé vient en second. Condition de validation : les écarts d'enquête entre Douala et Yaoundé sont en partie descriptifs ; c'est le pilote comparatif (conversion, marge, réachat) qui tranche entre lancement simultané et lancement décalé."}
  - {texte: "Bafoussam par un réseau de revendeurs : marché orienté prix ([[origine_ville.col(2,3,4|3)]] % des acheteurs achètent surtout des marques asiatiques, non référencées ou sans marque fixe), aux montants par achat élevés ([[g33.col(4,5|3)]] % à [[lit:500 000]] FCFA et plus), mieux servi par des revendeurs agréés que par un point de vente en propre. Condition de validation : valider localement les références demandées, les prix acceptés et la fréquence de réassort avant d'étendre le stock."}
  - {section: "B. Recommandations sur le mix marketing (4P)", niveau: 2}
  - {texte: "Les recommandations ci-dessous traduisent ce positionnement sur chacun des quatre leviers du mix marketing : le produit, le prix, la distribution et la communication. Le tableau 11 en présente la synthèse."}
  - {section: "1. Politique de produit", niveau: 3}
  - {texte: "Cœur de gamme toujours disponible : prises et interrupteurs ([[g11.pct(PRACPRIS)]] % des acheteurs), câbles et fils ([[g11.pct(PRACCABL)]] %), appareillage et disjoncteurs ([[g11.pct(PRACAPPA)]] %), luminaires ([[g11.pct(PRACLUMI)]] %). La disponibilité du stock est le troisième levier de fidélité ([[g40.pct(3)]] %)."}
  - {texte: "Deux niveaux de marques : une marque européenne de référence (Schneider ou Legrand) pour les électriciens, les entreprises et Yaoundé ; une marque asiatique certifiée de moyenne gamme pour les acheteurs qui choisissent sur le prix. [[dilemme.pct(1)]] % des répondants ayant un avis associent l'Europe à la qualité et l'Asie au prix : ils attendent une qualité vérifiable à un prix intermédiaire. Condition de validation : conformité de chaque référence asiatique vérifiée sur pièces avant référencement."}
  - {texte: "Pas de bas de gamme : ce segment est largement occupé par des produits dont l'origine et la conformité sont difficiles à vérifier, et dont le prix ne peut pas être concurrencé par un distributeur qui supporte des coûts de certification et de garantie. Condition de validation : l'enquête ne permet pas d'affirmer que tout le bas de gamme est contrefait ; le choix des références repose sur une vérification des fournisseurs et des documents de conformité."}
  - {texte: "Preuve d'authenticité intégrée au produit : certificat de conformité ANOR consultable, numéro de série ou code de vérification, emballage scellé, facture systématique. Condition de validation : toute mention de conformité est vérifiée référence par référence, et non déduite de la réputation de la marque."}
  - {texte: "Garantie avec remplacement immédiat en magasin, premier service attendu ([[service.pct(1)]] %), d'une durée modulée par ville : [[lit:6]] mois à [[lit:1]] an à Yaoundé ([[garantie_ville.col(2|2)]] % des acheteurs), moins de [[lit:6]] mois à Bafoussam ([[garantie_ville.col(1|3)]] %) et une durée de [[lit:6]] mois à [[lit:1]] an à confirmer pendant le pilote à Douala, où la part de [[garantie_ville.col(3,4|1)]] % demandant plus d'un an tient à un effet enquêteur (hors cet enquêteur, [[enq_duree.col(1|2)]] % se contentent de moins de [[lit:6]] mois). [[g50.pct(1,2)]] % des répondants n'attendent pas plus d'un an : une garantie plus longue coûterait sans être valorisée. Condition de validation : ne promettre le remplacement immédiat qu'une fois le stock de remplacement, les critères d'éligibilité et le coût des retours chiffrés."}
  - {texte: "Gamme solaire et onduleurs en deuxième phase : niche aujourd'hui ([[g11.pct(PRACSOLA)]] % des acheteurs), mais achetée par [[q9_entreprises.pct(PRACSOLA)]] % des entreprises."}
  - {section: "2. Politique de prix", niveau: 3}
  - {texte: "Prix publics alignés sur la grille attendue pour un disjoncteur : [[lit:5 000]] à [[lit:15 000]] FCFA en moyenne gamme, [[lit:15 000]] à [[lit:40 000]] FCFA en haut de gamme."}
  - {texte: "Écart maximal de +[[surcout_profil.mediane]] % avec la concurrence sur les produits équivalents (médiane du surcoût accepté) ; [[s1.ligne(P_REFUS10)]] % des répondants refusent plus de +[[lit:10]] %. La garantie et l'authenticité doivent justifier le choix du fournisseur, pas un prix plus élevé. Condition de validation : relevé de prix concurrentiel par référence (calibre, marque) avant de fixer la grille ; marge nette positive à vérifier à ce niveau de prix."}
  - {texte: "Modulation selon les cibles : le surcoût accepté est plus élevé chez les entreprises (+[[surcout_profil.groupe(2)]] %) et à Yaoundé (+[[surcout_ville.groupe(2)]] %), plus faible à Douala (+[[surcout_ville.groupe(1)]] %, [[g35.col(1|1)]] % n'acceptent aucun surcoût) et à Bafoussam (+[[surcout_ville.groupe(3)]] %)."}
  - {texte: "Remises plutôt que cartes de fidélité : les prix et promotions sont le premier levier de fidélité ([[g40.pct(1)]] %), les programmes de fidélité le dernier ([[g40.pct(6)]] %). D'où des remises sur volume pour les revendeurs, un tarif professionnel pour les électriciens et des offres ponctuelles sur les familles d'appel (câbles, prises)."}
  - {texte: "Conditions de paiement : espèces ([[g44.pct(1)]] %) et Mobile Money ([[g44.pct(2)]] %, [[paiement_ville.col(2|3)]] % à Bafoussam) au comptoir, virement pour les entreprises ([[g45.col(3|2)]] %). Le crédit fournisseur, utilisé par [[g44.pct(4)]] % des acheteurs, doit rester réservé à quelques comptes entreprises vérifiés."}
  - {section: "3. Politique de distribution", niveau: 3}
  - {texte: "Un comptoir-showroom de type grossiste spécialisé à Douala : c'est le premier lieu d'achat ([[circuits.pct(2)]] %) et le canal préféré ([[g53.pct(2)]] %), et [[meme_canal.pct(1)]] % des acheteurs préfèrent le canal qu'ils utilisent déjà. Un nouveau distributeur doit s'insérer dans ce canal plutôt qu'en créer un nouveau. Condition de validation : mesurer la fréquentation et la conversion pendant le pilote avant d'engager un bail long."}
  - {texte: "Un réseau de quincailleries et de revendeurs agréés (les quincailleries sont le lieu d'achat principal de [[circuits.pct(1)]] % des acheteurs) pour couvrir les quartiers et Bafoussam, avec un label « revendeur agréé » qui étend la garantie d'authenticité. Les quincailleries sont aussi le canal préféré des prescripteurs ([[canal_maillon.col(1|2)]] % des électriciens et entreprises du BTP) : le réseau agréé sert donc à la fois la couverture des quartiers et la prescription."}
  - {texte: "WhatsApp plutôt qu'un site marchand : l'achat en ligne n'est le lieu d'achat principal que de [[circuits.pct(6)]] % des acheteurs. WhatsApp Business peut servir de catalogue et d'outil de commande, avec retrait et vérification en magasin, ce qui répond aux deux premiers freins à l'achat en ligne (doute sur la qualité [[g57.pct(PRFRACLI|1)]] %, impossibilité de voir le produit [[g57.pct(PRFRACLI|2)]] %). Cibler d'abord les clients professionnels à gros panier et attachés au service, chez qui l'intention d'achat en ligne est la plus forte. Condition de validation : suivre le taux de conversion et le coût de traitement des commandes avant tout investissement dans une plateforme."}
  - {texte: "Disponibilité du stock des familles d'appel, condition de la fidélité, avec un suivi des ruptures par point de vente."}
  - {section: "4. Politique de communication", niveau: 3}
  - {texte: "Vente directe en priorité : [[g55.pct(1)]] % des acheteurs préfèrent être contactés en personne. Une force de vente terrain doit visiter les électriciens, les entreprises, les chantiers et les revendeurs."}
  - {texte: "WhatsApp et téléphone pour le suivi ([[g55.pct(3)]] % et [[g55.pct(2)]] % ; WhatsApp atteint [[contact_ville.col(3|1)]] % à Douala et [[contact_profil.col(3|2)]] % chez les entreprises). L'e-mail et les réseaux sociaux ([[g55.pct(4)]] % et [[g55.pct(5)]] %) ne doivent pas porter la communication commerciale."}
  - {texte: "Un message centré sur la confiance : « produit authentique, conforme et remplacé immédiatement en cas de défaut », réponse directe à la première attente du marché."}
  - {texte: "Animation des électriciens prescripteurs : démonstrations, formations techniques, tarif professionnel."}
  - {texte: "Preuve visible au point de vente : certificats de conformité, comparaison entre produit authentique et contrefaçon, conseil technique ([[g54.pct(2)]] % ; [[g39.col(2|2)]] % à Yaoundé)."}
  - {tableau: "11", id: t11, titre: "Synthèse des recommandations sur le mix marketing (4P)", source: "analyse M2B à partir de l'enquête EDM EE, oct. 2026", source_affichee: "analyse M2B à partir de l'enquête EDM EE, oct. 2026",
     contenu: [["Levier", "Recommandations clés", "Condition de validation"],
               ["Positionnement", "Distributeur de confiance de moyenne gamme : authenticité, conformité et remplacement garantis, à prix de marché. Cibles : professionnels (électriciens, entreprises), puis revendeurs ; Douala, puis Yaoundé (ou les deux simultanément), Bafoussam par revendeurs.", "Pilote : conversion et réachat conformes aux seuils, à prix de marché"],
               ["Produit", "Cœur de gamme toujours disponible (prises, câbles, disjoncteurs, luminaires) ; une marque européenne de référence et une marque asiatique certifiée ; pas de bas de gamme ; garantie avec remplacement immédiat, durée modulée par ville ; solaire en deuxième phase.", "Conformité vérifiée par référence ; coût des garanties et retours chiffré"],
               ["Prix", "Disjoncteur : [[lit:5 000]] à [[lit:15 000]] FCFA (moyenne gamme), [[lit:15 000]] à [[lit:40 000]] FCFA (haut de gamme) ; écart maximal de +[[surcout_profil.mediane]] % avec la concurrence ; remises sur volume et tarif professionnel ; espèces, Mobile Money et virement.", "Relevé de prix par référence ; marge nette positive à +[[surcout_profil.mediane]] % maximum"],
               ["Distribution", "Comptoir-showroom grossiste à Douala, puis Yaoundé (ou simultanément) ; revendeurs agréés pour les quartiers et Bafoussam ; WhatsApp et retrait en magasin plutôt qu'un site de commerce en ligne.", "Audit loyers et logistique ; pilote comparatif Douala – Yaoundé"],
               ["Communication", "Force de vente terrain ; WhatsApp et téléphone ; message centré sur l'authenticité et la garantie ; animation des électriciens prescripteurs ; preuve visible au point de vente.", "Promesse de garantie lancée seulement si le stock de remplacement est en place"],
               ["Indicateurs de suivi", "Part des ventes aux professionnels, taux de réachat mensuel, taux de retours sous garantie, panier moyen, nombre de revendeurs agréés actifs, taux de rupture des familles d'appel.", "Seuils de décision fixés avant le pilote (go / no-go)"]]}
  - {texte: "Note de lecture : synthèse des recommandations de la partie V, établies à partir des [[base.retenues]] fiches analysées."}
  - {section: "C. Conditions de réussite et risques", niveau: 2}
  - {calcul: valeurs_asie_nv, procedure: parts_bootstrap, source: "N08_A_RAPPORT_427.sps:236-247",
     arguments: {variable: ORIG_MARQ3, poids: DEPENSE_AN, groupes: {AsieNV: [2, 3]}}}
  - {calcul: villes, procedure: frequences, arguments: {variable: VILLEREG}, source: "N08_A_RAPPORT_427.sps:122-126"}
  - {texte: "Ces recommandations reposent sur une hypothèse forte : des clients qui disent rechercher la qualité achèteront chez un distributeur qui la garantit, sans payer beaucoup plus cher. Plusieurs résultats de l'enquête plaident en sens inverse et doivent être pris au sérieux avant toute décision."}
  - {texte: "Le scénario alternatif : un positionnement de volume sur une sélection de références asiatiques compétitives a de solides arguments. Les marques asiatiques, d'origine non vérifiée et les achats sans marque fixe représentent un peu plus de la moitié de la dépense estimée (ordre de grandeur : [[valeurs_asie_nv.bas(AsieNV)]] à [[valeurs_asie_nv.haut(AsieNV)]] %), sont en tête à Bafoussam ([[origine_ville.col(2,3,4|3)]] % des acheteurs), et le prix est à la fois un frein majeur ([[g38.pct(PRINFREI|1)]] %) et le premier levier de fidélité ([[g40.pct(1)]] %). Il expose cependant à une concurrence frontale avec les produits non conformes, sur des marges faibles. Il doit être chiffré en parallèle du positionnement de confiance (coûts d'approvisionnement, retours, rotation, besoin en fonds de roulement), à condition que la conformité des références soit vérifiée."}
  - {texte: "Une prime de qualité faible : +[[surcout_profil.mediane]] % en médiane, avec [[g44.pct(1)]] % des acheteurs qui paient surtout en espèces. Les coûts de certification, de garantie et de stock doivent être couverts par le volume et la négociation avec les fournisseurs, pas par le prix de vente. Ces postes doivent être chiffrés avant de fixer la politique tarifaire ou la promesse de remplacement."}
  - {texte: "Une fidélité au canal qui freine la conquête : [[meme_canal.pct(1)]] % des acheteurs préfèrent leur canal actuel et [[fidele_ville.col(1|2)]] % des clients de Yaoundé sont fidèles. La conquête sera plus lente que ne le laisse penser l'insatisfaction déclarée. La stratégie doit prévoir une période d'essai, des commandes pilotes et un suivi des premières ventes pour apporter la preuve de fiabilité."}
  - {texte: "Une taille de marché inconnue : avant tout investissement, il faut obtenir les statistiques douanières d'importation (chapitre [[lit:85]] du Système harmonisé, et [[lit:94]] pour les luminaires), réaliser un audit des prix pratiqués en points de vente et chiffrer le coût de la certification ANOR par famille de produits. Avec une cartographie des concurrents, ces travaux permettront de calculer un marché adressable réaliste et de construire un plan financier défendable."}
  - {texte: "Le circuit de la marque Yaki, première marque à Douala et portée par les revendeurs, doit être documenté (origine, importateur, disponibilité, gamme, prix, garanties, conformité) : c'est soit un partenaire d'approvisionnement potentiel, soit le concurrent direct à surveiller."}
  - {texte: "Des croisements fins à lire comme indicatifs : avec [[villes.eff_min]] à [[villes.eff_max]] répondants par ville, les croisements ville par profil reposent parfois sur moins de [[lit:30]] répondants, et les parts présentées sont des parts d'acheteurs, pas des parts de marché. Les résultats portent sur [[base.retenues]] fiches retenues après l'exclusion de [[base.ecartees]] fiches incomplètes ou dupliquées."}

