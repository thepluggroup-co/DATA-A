  - {calcul: origine, procedure: frequences, arguments: {variable: ORIG_MARQ}, source: "N08_A_RAPPORT_427.sps:136-137"}
  - {section: "a) Connaissance des matériels et équipements électriques et présence des marques", niveau: 4}
  - {texte: "Le questionnaire ne mesure pas la notoriété spontanée ou assistée des marques : la connaissance du marché est approchée par la marque achetée le plus souvent, qui révèle ce que l'acheteur met réellement dans son panier. Sur ce terrain, Schneider s'impose comme la référence ([[marques.pct(1)]] % des acheteurs), devant Yaki ([[marques.pct(5)]] %), les marques chinoises ([[marques.pct(3)]] %) et Legrand ([[marques.pct(2)]] %). Yaki, absente de la liste du questionnaire, a été reconstituée à partir des réponses « autre marque » : sa deuxième place est la première surprise de l'étude."}
  - {texte: "Le marché camerounais compte une panoplie de marques européennes, asiatiques et de marques dont l'origine n'est pas vérifiable. Les marques européennes réunissent [[origine.pct(1)]] % des acheteurs, les marques asiatiques [[origine.pct(2)]] %, et [[origine.pct(3,4)]] % achètent une marque d'origine non vérifiée ou n'ont pas de marque fixe. Les marques les plus achetées sont présentées dans le tableau 7 suivant."}
  - {tableau: "7", id: t7, titre: "Marques achetées le plus souvent (pénétration, et non notoriété)", source: "enquête EDM EE, oct. 2026 (N08_A_RAPPORT_427.sps:136-142)",
     contenu: [["Marques européennes", "Part des acheteurs", "Marques asiatiques et d'origine non vérifiée", "Part des acheteurs"],
               ["Schneider", "[[marques.pct(1)]] %", "Yaki", "[[marques.pct(5)]] %"],
               ["Legrand", "[[marques.pct(2)]] %", "Autres non réf. / sans marque fixe", "[[marques.pct(6,8,9)]] %"],
               ["Philips", "[[marques.pct(4)]] %", "Chint / chinoises", "[[marques.pct(3)]] %"],
               ["Siemens", "[[marques_liste.pct(6)]] %", "Growatt", "[[marques_liste.pct(11)]] %"],
               ["ABB / Hager", "[[marques_liste.pct(4,5)]] %", "Vectron", "[[marques_liste.pct(3)]] %"]]}
  - {texte: "Note de lecture : part des acheteurs citant la marque qu'ils achètent le plus souvent (n = [[marques.base]] réponses valides). Ce n'est ni une mesure de notoriété ni une part de marché nationale. Les totaux par origine sont calculés sur les effectifs : ils peuvent différer de [[lit:0,1]] point de la somme des pourcentages arrondis."}
  - {section: "b) Moyens de connaissance des marques et facteurs d'accroche", niveau: 4}
  - {figure: "9", id: g9, titre: "Origine des marques de matériels et équipements électriques achetées au Cameroun", source: "N08_A_RAPPORT_427.sps:136-137",
     procedure: frequences, arguments: {variable: ORIG_MARQ3}, forme: secteurs}
  - {texte: "Selon l'origine, un acheteur sur deux ([[g9.pct(1)]] %) achète le plus souvent une marque européenne, un sur six ([[g9.pct(2)]] %) une marque asiatique, et près d'un sur trois ([[g9.pct(3)]] %) une marque d'origine non vérifiable ou aucune marque fixe : c'est là que se loge l'incertitude du marché."}
  - {figure: "10", id: g10, titre: "Importance accordée à la marque dans l'achat des matériels et équipements électriques", source: "N08_A_RAPPORT_427.sps:144-146",
     procedure: frequences, arguments: {variable: IMPOMARQ}, forme: secteurs}
  - {calcul: marque_profil, procedure: tri_croise, arguments: {ligne: IMPOMARQ, colonne: PROFIL4}, source: "N08_A_RAPPORT_427.sps:146"}
  - {texte: "La marque reste un facteur d'accroche majeur : [[g10.pct(1,2)]] % des acheteurs la jugent très importante ou importante. Son poids varie nettement selon le profil : [[marque_profil.col(1,2|2)]] % chez les entreprises, [[marque_profil.col(1,2|3)]] % chez les électriciens, contre [[marque_profil.col(1,2|4)]] % chez les revendeurs, sans doute plus attentifs à ce qui se vend qu'à la signature du produit."}
  - {section: "Analyse qualitative – structure de l'offre", niveau: 4}
  - {calcul: origine_ville, procedure: tri_croise, arguments: {ligne: ORIG_MARQ, colonne: VILLEREG}, source: "N08_A_RAPPORT_427.sps:122-126"}
  - {calcul: marque_ville, procedure: tri_croise, arguments: {ligne: MARQUE_G, colonne: VILLEREG}, source: "N08_A_RAPPORT_427.sps:223-224"}
  - {calcul: marque_prof, procedure: tri_croise, arguments: {ligne: MARQUE_G, colonne: PROFIL4}, source: "N08_A_RAPPORT_427.sps:223-224"}
  - {texte: "L'offre s'organise autour de deux pôles. D'un côté, les marques européennes de référence (Schneider, Legrand), associées à la qualité et à la conformité aux normes, qui dominent à Yaoundé ([[origine_ville.col(1|2)]] % des acheteurs y achètent surtout une marque européenne) et chez les électriciens. De l'autre, les produits asiatiques, non référencés ou achetés sans marque fixe, associés au prix, majoritaires à Bafoussam ([[origine_ville.col(2,3,4|3)]] % des acheteurs)."}
  - {texte: "Entre les deux s'est glissée une marque que le questionnaire n'avait pas prévue : Yaki, première marque à Douala ([[marque_ville.col(5|1)]] % des acheteurs). Son succès passe d'abord par les distributeurs : [[marque_prof.col(5|4)]] % des revendeurs l'achètent le plus souvent, contre [[marque_prof.col(5|3)]] % des électriciens et artisans. Son origine et son circuit d'importation restent à documenter."}
  - {section: "Analyse qualitative – qualité et conformité des produits importés", niveau: 4}
  - {texte: "Les produits importés au Cameroun sont soumis au Programme d'Évaluation de la Conformité Avant Embarquement (PECAE) mis en place par l'Agence des Normes et de la Qualité (ANOR) : un certificat de conformité délivré par l'ANOR est exigé pour le dédouanement des produits réglementés."}
  - {texte: "Malgré ce dispositif, la crainte de la contrefaçon est forte : [[s1.ligne(P_CONTREF)]] % des acheteurs craignent souvent ou parfois d'acheter un produit contrefait ou non conforme, et [[s1.ligne(P_DECU)]] % ont déjà été déçus par un achat. Le marché fonctionne donc sur une confiance entamée : c'est le fil rouge de toute la suite de l'analyse."}
  - {texte: "Le volume et la valeur des importations de matériel électrique ne sont pas mesurés par l'enquête : ils doivent être établis par une recherche documentaire (statistiques douanières) pour dimensionner le marché."}

  # ------------------------------------------------------------------------------------------- III.B.2 demande (p. 26-41)
  - {section: "2) Analyse de la demande de matériels et équipements électriques", niveau: 3}
  - {section: "a) Identification des clients cibles", niveau: 4}
  - {texte: "Après l'offre, place à ceux qui l'achètent. Destinés à des usages variés (construction, rénovation, entretien, équipement des ménages et des entreprises), les matériels et équipements électriques sont achetés par cinq types de clients. Selon leur rôle dans la chaîne, ils forment trois familles (tableau 1) : utilisateurs finaux, prescripteurs et distributeurs. Selon leur mode d'approvisionnement, le tableau 8 distingue les clients directs, qui achètent auprès des grossistes et des importateurs, et les clients indirects, qui passent par les revendeurs."}
  - {tableau: "8", id: t8, titre: "Types de cibles", source: "cahier des charges de l'étude", source_affichee: "cahier des charges de l'étude",
     contenu: [["Clients directs : professionnels utilisateurs", "Clients directs : distributeurs", "Clients indirects : consommateurs finaux"],
               ["Entreprises (PME, industries) ; entreprises du BTP ; électriciens / artisans", "Revendeurs / grossistes", "Ménages / particuliers"]]}
  - {texte: "Les clients indirects, constitués des particuliers essentiellement, s'approvisionnent auprès des revendeurs, des quincailleries et des marchés. Les clients directs (entreprises, électriciens, revendeurs) achètent davantage auprès des grossistes spécialisés et des importateurs."}
  - {section: "b) Les comportements d'achat en matériels et équipements électriques", niveau: 4}
  - {figure: "11", id: g11, titre: "Familles de produits achetées / commercialisées habituellement", source: "N08_A_RAPPORT_427.sps:151-158",
     procedure: reponses_multiples, arguments: {variables: [PRACPRIS, PRACCABL, PRACAPPA, PRACLUMI, PRACSOLA, PRACGROU]}}
  - {calcul: q9_entreprises, procedure: reponses_multiples, arguments: {variables: [PRACCABL, PRACAPPA, PRACPRIS, PRACLUMI, PRACSOLA, PRACGROU]},
     filtre: "PROFIL4 == 2", source: "N08_A_RAPPORT_427.sps:151-158"}
  - {texte: "L'enquête dessine un marché centré sur le petit matériel de second œuvre : prises et interrupteurs ([[g11.pct(PRACPRIS)]] % des répondants), câbles et fils ([[g11.pct(PRACCABL)]] %), appareillage et disjoncteurs ([[g11.pct(PRACAPPA)]] %), puis luminaires ([[g11.pct(PRACLUMI)]] %). Le solaire et les onduleurs ([[g11.pct(PRACSOLA)]] %) et les groupes électrogènes ([[g11.pct(PRACGROU)]] %) restent des niches, mais des niches professionnelles : [[q9_entreprises.pct(PRACSOLA)]] % des entreprises achètent du solaire."}
  - {figure: "12", id: g12, titre: "Gamme de produits achetée le plus souvent", source: "N08_A_RAPPORT_427.sps:160-161", procedure: frequences, arguments: {variable: GAACPLSO}, forme: secteurs}
  - {texte: "Le marché est d'abord un marché de moyenne gamme ([[g12.pct(2)]] %), devant le haut de gamme ([[g12.pct(1)]] %), les achats « selon le projet » ([[g12.pct(4)]] %) et le bas de gamme ([[g12.pct(3)]] %)."}
  - {figure: "13", id: g13, titre: "Montant moyen dépensé par achat", source: "N08_A_RAPPORT_427.sps:160-161", procedure: frequences, arguments: {variable: MONMOYAC}, forme: secteurs}
  - {texte: "Le panier moyen se situe le plus souvent entre [[lit:25 000]] et [[lit:100 000]] FCFA ([[g13.pct(2)]] %), puis entre [[lit:100 000]] et [[lit:500 000]] FCFA ([[g13.pct(3)]] %) ; un acheteur sur cinq ([[g13.pct(4,5)]] %) dépense plus de [[lit:500 000]] FCFA par achat (base : [[g13.base]] répondants)."}
  - {figure: "14", id: g14, titre: "Principal critère de choix d'un produit ou d'une marque", source: "N08_A_RAPPORT_427.sps:160-161", procedure: frequences, arguments: {variable: PRCRICHO}, forme: secteurs}
  - {texte: "Au moment du choix, le discours est sans ambiguïté : la qualité et la durabilité sont le premier critère pour [[g14.pct(2)]] % des acheteurs, loin devant le prix ([[g14.pct(1)]] %) et la disponibilité ([[g14.pct(3)]] %). La notoriété, la garantie et la conformité aux normes ne sont citées qu'à la marge ; notre lecture : la qualité est attendue comme une évidence plus que comme un label."}
  - {figure: "15", id: g15, titre: "Lieu habituel d'achat du matériel électrique", source: "N08_A_RAPPORT_427.sps:160-161", procedure: frequences, arguments: {variable: LIEACHPR}}
  - {texte: "Le grossiste spécialisé est le pivot de la distribution ([[g15.pct(2)]] %), suivi des marchés ([[g15.pct(4)]] %), des importateurs ([[g15.pct(5)]] %) et des quincailleries ([[g15.pct(1)]] %). L'achat en ligne reste marginal ([[g15.pct(6)]] %)."}
  - {figure: "16", id: g16, titre: "Profil des acheteurs de matériels et équipements électriques", source: "N08_A_RAPPORT_427.sps:160-161", procedure: frequences, arguments: {variable: VOUSETES}}
  - {calcul: maillons, procedure: frequences, arguments: {variable: CATEG3}, source: "N08_A_RAPPORT_427.sps:160-161"}
  - {texte: "Ces produits sont achetés par les particuliers ([[g16.pct(1)]] % des répondants), les revendeurs et grossistes ([[g16.pct(5)]] %), les électriciens et artisans ([[g16.pct(3)]] %), les entreprises PME ([[g16.pct(2)]] %) et les entreprises du BTP ([[g16.pct(4)]] %). Par maillon de la chaîne, les utilisateurs finaux pèsent [[maillons.pct(1)]] %, les distributeurs [[maillons.pct(3)]] % et les prescripteurs [[maillons.pct(2)]] % : trois logiques d'achat différentes, que l'analyse distingue lorsque l'écart est marqué."}
  - {section: "Acceptabilité des prix des matériels et équipements électriques", niveau: 4}
  - {texte: "Les prix attendus ont été mesurés sur un article courant, le disjoncteur, pour chacune des trois gammes. Les graphiques suivants présentent les fourchettes de prix associées à chaque gamme, pour l'ensemble des répondants puis pour chaque profil, ainsi que les éléments qui fondent la perception des gammes."}
  - {section: "i. Prix attendus d'un disjoncteur selon la gamme : ensemble, particuliers et entreprises", niveau: 4}
  - {figure: "17", id: g17, titre: "Prix attendus d'un disjoncteur selon la gamme – ensemble des répondants", source: "N08_A_RAPPORT_427.sps:163-165",
     procedure: batterie, arguments: {variables: [PXHAUTGA, PXMOYEGA, PXBASGAM]}, forme: groupees}
  - {figure: "18", id: g18, titre: "Prix attendus d'un disjoncteur selon la gamme – particuliers", source: "N08_A_RAPPORT_427.sps:163-165",
     procedure: batterie, arguments: {variables: [PXHAUTGA, PXMOYEGA, PXBASGAM]}, filtre: "PROFIL4 == 1", forme: groupees}
  - {texte: "Pour l'ensemble des répondants (n = [[g17.base_min]] à [[g17.base_max]] selon la gamme), un disjoncteur de bas de gamme est attendu à moins de [[lit:5 000]] FCFA ([[g17.pct(PXBASGAM|1)]] %), un disjoncteur de moyenne gamme entre [[lit:5 000]] et [[lit:15 000]] FCFA ([[g17.pct(PXMOYEGA|2)]] %) et un disjoncteur de haut de gamme entre [[lit:15 000]] et [[lit:40 000]] FCFA ([[g17.pct(PXHAUTGA|3)]] %). Les entreprises placent le haut de gamme plus haut ([[g19.pct(PXHAUTGA|4)]] % au-delà de [[lit:40 000]] FCFA), les particuliers plus bas ([[g18.pct(PXHAUTGA|2)]] % entre [[lit:5 000]] et [[lit:15 000]] FCFA)."}
  - {figure: "19", id: g19, titre: "Prix attendus d'un disjoncteur selon la gamme – entreprises (PME et BTP)", source: "N08_A_RAPPORT_427.sps:163-165",
     procedure: batterie, arguments: {variables: [PXHAUTGA, PXMOYEGA, PXBASGAM]}, filtre: "PROFIL4 == 2", forme: groupees}
  - {texte: "Les entreprises (PME et BTP) acceptent les prix les plus élevés pour le haut de gamme : [[g19.pct(PXHAUTGA|4)]] % le situent au-delà de [[lit:40 000]] FCFA, contre [[g18.pct(PXHAUTGA|4)]] % des particuliers."}
  - {section: "ii. Prix attendus selon la gamme : électriciens et revendeurs ; écart de qualité perçu", niveau: 4}
  - {figure: "20", id: g20, titre: "Prix attendus d'un disjoncteur selon la gamme – électriciens / artisans", source: "N08_A_RAPPORT_427.sps:163-165",
     procedure: batterie, arguments: {variables: [PXHAUTGA, PXMOYEGA, PXBASGAM]}, filtre: "PROFIL4 == 3", forme: groupees}
  - {figure: "21", id: g21, titre: "Prix attendus d'un disjoncteur selon la gamme – revendeurs / grossistes", source: "N08_A_RAPPORT_427.sps:163-165",
     procedure: batterie, arguments: {variables: [PXHAUTGA, PXMOYEGA, PXBASGAM]}, filtre: "PROFIL4 == 4", forme: groupees}
  - {texte: "Les électriciens et les revendeurs, qui connaissent les prix du marché, situent le haut de gamme entre [[lit:15 000]] et [[lit:40 000]] FCFA ([[g20.pct(PXHAUTGA|3)]] % et [[g21.pct(PXHAUTGA|3)]] %) et la moyenne gamme entre [[lit:5 000]] et [[lit:15 000]] FCFA ([[g20.pct(PXMOYEGA|2)]] % et [[g21.pct(PXMOYEGA|2)]] %). Leur grille, plus resserrée, est vraisemblablement la plus proche des prix réellement pratiqués."}
  - {texte: "Note de lecture : ces fourchettes sont des prix attendus déclarés. Elles servent de point de départ à un relevé concurrentiel ; elles ne constituent pas une grille tarifaire tant qu'elles n'ont pas été contrôlées par référence, calibre et marque en point de vente."}
  - {figure: "22", id: g22, titre: "Écart de qualité perçu entre haut et bas de gamme, par ville", source: "N08_A_RAPPORT_427.sps:167-168",
     procedure: tri_croise, arguments: {ligne: ECQUHABA, colonne: VILLEREG}, forme: groupees}
  - {calcul: ecart, procedure: frequences, arguments: {variable: ECQUHABA}, source: "N08_A_RAPPORT_427.sps:200-201"}
  - {calcul: surcout_ville, procedure: moyennes, arguments: {variable: SURCOUT_PCT, par: VILLEREG}, source: "N08_A_RAPPORT_427.sps:188-190"}
  - {texte: "L'écart de qualité entre le haut et le bas de gamme est jugé important ou très important par [[ecart.pct(1,2)]] % des répondants ; il l'est davantage à Yaoundé ([[g22.col(1,2|2)]] %) qu'à Bafoussam ([[g22.col(1,2|3)]] %), où l'acheteur distingue moins les gammes ; c'est aussi la ville où le surcoût accepté est le plus faible (+[[surcout_ville.groupe(3)]] %)."}
  - {section: "iii. Priorité d'achat et gamme achetée", niveau: 4}
  - {figure: "23", id: g23, titre: "Priorité principale à l'achat, par profil", source: "N08_A_RAPPORT_427.sps:169-170",
     procedure: tri_croise, arguments: {ligne: PRIOPRIN, colonne: PROFIL4}, forme: groupees}
  - {calcul: priorite, procedure: frequences, arguments: {variable: PRIOPRIN}, source: "N08_A_RAPPORT_427.sps:169-170"}
  - {texte: "La priorité principale à l'achat est le meilleur rapport qualité/prix ([[priorite.pct(2)]] %), loin devant la meilleure qualité quel que soit le prix ([[priorite.pct(3)]] %) et le moins cher ([[priorite.pct(1)]] %). Les électriciens ([[g23.col(3|3)]] %) et les revendeurs ([[g23.col(3|4)]] %) semblent plus nombreux que les particuliers ([[g23.col(3|1)]] %) à rechercher la qualité à tout prix ; l'écart global selon le profil est significatif (p [[g23.p_txt]]), mais ces comparaisons deux à deux n'ont pas été testées : c'est une tendance à confirmer."}
  - {figure: "24", id: g24, titre: "Priorité principale à l'achat, par ville", source: "N08_A_RAPPORT_427.sps:167-168",
     procedure: tri_croise, arguments: {ligne: PRIOPRIN, colonne: VILLEREG}, forme: groupees}
  - {figure: "25", id: g25, titre: "Gamme achetée le plus souvent, par ville", source: "N08_A_RAPPORT_427.sps:167-168",
     procedure: tri_croise, arguments: {ligne: GAACPLSO, colonne: VILLEREG}, forme: groupees}
  - {section: "iv. Gamme achetée, écart de qualité et montant d'achat par profil", niveau: 4}
  - {figure: "26", id: g26, titre: "Gamme achetée le plus souvent, par profil", source: "N08_A_RAPPORT_427.sps:169-170",
     procedure: tri_croise, arguments: {ligne: GAACPLSO, colonne: PROFIL4}, forme: groupees}
  - {texte: "Les entreprises achètent surtout du haut de gamme ([[g26.col(1|2)]] %), les particuliers et les revendeurs surtout de la moyenne gamme ([[g26.col(2|1)]] % et [[g26.col(2|4)]] %). Le bas de gamme est plus présent à Bafoussam ([[g25.col(3|3)]] %) et à Yaoundé ([[g25.col(3|2)]] %) qu'à Douala ([[g25.col(3|1)]] %)."}
  - {figure: "27", id: g27, titre: "Écart de qualité perçu entre haut et bas de gamme, par profil", source: "N08_A_RAPPORT_427.sps:169-170",
     procedure: tri_croise, arguments: {ligne: ECQUHABA, colonne: PROFIL4}, forme: groupees}
  - {figure: "28", id: g28, titre: "Montant moyen par achat, par profil", source: "N08_A_RAPPORT_427.sps:169-170",
     procedure: tri_croise, arguments: {ligne: MONMOYAC, colonne: PROFIL4}, forme: empilees}
  - {texte: "Le montant moyen par achat est le plus élevé chez les entreprises ([[g28.col(3,4,5|2)]] % dépensent [[lit:100 000]] FCFA ou plus par achat) et le plus faible chez les électriciens ([[g28.col(3,4,5|3)]] %), sans doute parce qu'ils achètent au fil des chantiers (hypothèse à vérifier). Note de lecture : les profils se comparent ici de façon descriptive ; la dépense annuelle qui en découle est une estimation (point milieu des tranches × fréquence), pas une dépense comptable."}
  - {section: "v. Définition du haut et du bas de gamme", niveau: 4}
  - {figure: "29", id: g29, titre: "Ce qui définit avant tout un produit haut de gamme", source: "N08_A_RAPPORT_427.sps:172-173", procedure: frequences, arguments: {variable: DEAVHAGA}}
  - {texte: "Le haut de gamme se définit d'abord par la durabilité et la fiabilité ([[g29.pct(3)]] %), devant le prix élevé ([[g29.pct(1)]] %), la marque reconnue ([[g29.pct(2)]] %) et les certifications ([[g29.pct(5)]] %). L'origine ne définit le haut de gamme que pour [[g29.pct(4)]] % des répondants. Notre lecture : l'acheteur paie une durée de vie plus qu'un pays."}
  - {figure: "30", id: g30, titre: "Ce qui caractérise avant tout un produit bas de gamme", source: "N08_A_RAPPORT_427.sps:172-173", procedure: frequences, arguments: {variable: CAAVBAGA}}
  - {texte: "Le bas de gamme se reconnaît d'abord à une durée de vie courte ([[g30.pct(4)]] %) et au prix bas ([[g30.pct(1)]] %), puis au risque de non-conformité ([[g30.pct(6)]] %) et à l'absence de marque connue ([[g30.pct(3)]] %)."}
  - {figure: "31", id: g31, titre: "Origine associée spontanément au haut et au bas de gamme", source: "N08_A_RAPPORT_427.sps:172-173",
     procedure: batterie, arguments: {variables: [ORASHAGA, ORASBAGA]}, forme: groupees}
  - {calcul: haut_avis, procedure: frequences, arguments: {variable: ORHG_AV}, source: "N08_A_RAPPORT_427.sps:173"}
  - {calcul: bas_avis, procedure: frequences, arguments: {variable: ORBG_AV}, source: "N08_A_RAPPORT_427.sps:173"}
  - {texte: "Spontanément, le haut de gamme est associé à l'Europe ([[g31.pct(ORASHAGA|1)]] %) et le bas de gamme à l'Asie ([[g31.pct(ORASBAGA|2)]] %), mais une part importante des répondants n'associe aucune origine aux gammes ([[g31.pct(ORASHAGA|98)]] % pour le haut de gamme, [[g31.pct(ORASBAGA|98)]] % pour le bas de gamme). Parmi ceux qui ont un avis, l'association est en revanche très nette : [[haut_avis.pct(1)]] % pour l'Europe et le haut de gamme, [[bas_avis.pct(2)]] % pour l'Asie et le bas de gamme."}
  - {texte: "La grille de prix psychologique d'un disjoncteur courant s'établit ainsi : moins de [[lit:5 000]] FCFA pour le bas de gamme, [[lit:5 000]] à [[lit:15 000]] FCFA pour la moyenne gamme, [[lit:15 000]] à [[lit:40 000]] FCFA pour le haut de gamme. Cette grille est directement exploitable pour la politique tarifaire d'un nouveau distributeur."}
  - {figure: "32", id: g32, titre: "Fréquence d'achat des matériels et équipements électriques (Douala, Yaoundé, Bafoussam, ensemble)", source: "N08_A_RAPPORT_427.sps:175-177",
     procedure: tri_croise, arguments: {ligne: FREQACHA, colonne: VILLEREG}, forme: secteurs_colonnes}
  - {calcul: frequence, procedure: frequences, arguments: {variable: FREQACHA}, source: "N08_A_RAPPORT_427.sps:175-176"}
  - {calcul: frequence_profil, procedure: tri_croise, arguments: {ligne: FREQACHA, colonne: PROFIL4}, source: "N08_A_RAPPORT_427.sps:177"}
  - {texte: "La fréquence d'achat est élevée : [[frequence.pct(1)]] % des répondants achètent du matériel électrique chaque semaine et [[frequence.pct(2)]] % une à trois fois par mois. Douala achète le plus souvent ([[g32.col(1|1)]] % chaque semaine) ; Bafoussam achète moins souvent ([[g32.col(3|3)]] % quelques fois par an) mais par montants plus élevés. Les achats hebdomadaires sont surtout le fait des revendeurs ([[frequence_profil.col(1|4)]] %) et des entreprises ([[frequence_profil.col(1|2)]] %)."}
  - {calcul: depense_profil, procedure: moyennes, arguments: {variable: DEPENSE_AN, par: PROFIL4}, source: "N08_A_RAPPORT_427.sps:179-183"}
  - {texte: "La dépense annuelle estimée (point milieu de la tranche de montant multiplié par le nombre d'achats par an) est en médiane de [[depense_profil.mediane_millions]] millions FCFA. Elle est plus élevée pour les entreprises ([[depense_profil.groupe_mediane_millions(2)]] millions FCFA) que pour les particuliers et les revendeurs ([[depense_profil.groupe_mediane_millions(1)]] millions FCFA) et les électriciens ([[depense_profil.groupe_mediane_millions(3)]] million FCFA). Cette estimation sert à comparer les profils entre eux ; elle doit être confirmée par le pilote avant d'entrer dans un modèle financier."}
  - {figure: "33", id: g33, titre: "Montant moyen par achat, par ville", source: "N08_A_RAPPORT_427.sps:185-186",
     procedure: tri_croise, arguments: {ligne: MONMOYAC, colonne: VILLEREG}, forme: empilees}
  - {calcul: depense_ville, procedure: moyennes, arguments: {variable: DEPENSE_AN, par: VILLEREG}, source: "N08_A_RAPPORT_427.sps:180"}
  - {calcul: depense_dla_yde, procedure: mann_whitney, arguments: {variable: DEPENSE_AN, groupe: VILLEREG, codes: [1, 2]}, source: "N08_A_RAPPORT_427.sps:181"}
  - {texte: "Selon la ville, le montant moyen par achat se présente comme suit. Douala : [[lit:25 000]] à [[lit:100 000]] FCFA pour [[g33.col(2|1)]] % des acheteurs ; [[lit:100 000]] FCFA et plus pour [[g33.col(3,4,5|1)]] %. Yaoundé : [[lit:25 000]] à [[lit:100 000]] FCFA pour [[g33.col(2|2)]] % ; [[lit:100 000]] FCFA et plus pour [[g33.col(3,4,5|2)]] %. Bafoussam : [[lit:100 000]] à [[lit:500 000]] FCFA pour [[g33.col(3|3)]] % ; [[lit:500 000]] FCFA et plus pour [[g33.col(4,5|3)]] %. Ensemble : [[lit:25 000]] à [[lit:100 000]] FCFA pour [[g13.pct(2)]] % ; [[lit:100 000]] FCFA et plus pour [[g13.pct(3,4,5)]] %. Dépense annuelle médiane estimée : [[depense_ville.groupe_mediane_millions(1)]] millions FCFA (Douala), [[depense_ville.groupe_mediane_millions(2)]] millions FCFA (Yaoundé), [[depense_ville.groupe_mediane_millions(3)]] millions FCFA (Bafoussam) ; écart Douala–Yaoundé non significatif (Mann-Whitney, p [[depense_dla_yde.p_txt]])."}
  - {figure: "34", id: g34, titre: "Surcoût accepté pour monter en gamme, par profil", source: "N08_A_RAPPORT_427.sps:188-190",
     procedure: tri_croise, arguments: {ligne: SUACMOGA, colonne: PROFIL4}, forme: empilees}
  - {calcul: surcout_profil, procedure: moyennes, arguments: {variable: SURCOUT_PCT, par: PROFIL4}, source: "N08_A_RAPPORT_427.sps:190"}
  - {texte: "Le surcoût accepté pour monter en gamme est faible (médiane de +[[surcout_profil.mediane]] %). Selon le profil, il est en moyenne de : particuliers +[[surcout_profil.groupe(1)]] % ([[g34.col(1|1)]] % n'acceptent aucun surcoût) ; entreprises (PME + BTP) +[[surcout_profil.groupe(2)]] % ([[g34.col(3,4,5|2)]] % acceptent plus de +[[lit:10]] %) ; électriciens / artisans +[[surcout_profil.groupe(3)]] % ; revendeurs / grossistes +[[surcout_profil.groupe(4)]] % ; ensemble +[[surcout_profil.moyenne]] % ; [[s1.ligne(P_REFUS10)]] % des répondants n'acceptent pas plus de +[[lit:10]] %."}
  - {figure: "35", id: g35, titre: "Surcoût accepté pour monter en gamme, par ville", source: "N08_A_RAPPORT_427.sps:188-190",
     procedure: tri_croise, arguments: {ligne: SUACMOGA, colonne: VILLEREG}, forme: empilees}
  - {calcul: surcout_gamme, procedure: moyennes, arguments: {variable: SURCOUT_PCT, par: GAACPLSO}, source: "N08_A_RAPPORT_427.sps:190"}
  - {texte: "Selon la ville, le surcoût accepté pour monter en gamme est en moyenne de : Douala +[[surcout_ville.groupe(1)]] % ([[g35.col(1|1)]] % n'acceptent aucun surcoût) ; Yaoundé +[[surcout_ville.groupe(2)]] % ([[g35.col(3,4,5|2)]] % acceptent plus de +[[lit:10]] %) ; Bafoussam +[[surcout_ville.groupe(3)]] % ; acheteurs de haut de gamme +[[surcout_gamme.groupe(1)]] % ; acheteurs de bas de gamme +[[surcout_gamme.groupe(3)]] %."}
  - {calcul: kw_maillon, procedure: kruskal_wallis, arguments: {variable: SUACMOGA, groupe: CATEG3}, source: "N08_A_RAPPORT_427.sps:191"}
  - {calcul: kw_ville, procedure: kruskal_wallis, arguments: {variable: SUACMOGA, groupe: VILLEREG}, source: "N08_A_RAPPORT_427.sps:127"}
  - {calcul: kw_profil, procedure: kruskal_wallis, arguments: {variable: SUACMOGA, groupe: PROFIL4}, source: "N08_A_RAPPORT_427.sps:127"}
  - {calcul: rho_sav, procedure: spearman, arguments: {x: SUACMOGA, y: IMSECSAV}, source: "N08_A_RAPPORT_427.sps:192-193"}
  - {calcul: rho_contref, procedure: spearman, arguments: {x: SUACMOGA, y: CRACPRCO}, source: "N08_A_RAPPORT_427.sps:192-193"}
  - {calcul: rho_ecart, procedure: spearman, arguments: {x: SUACMOGA, y: ECQUHABA}, source: "N08_A_RAPPORT_427.sps:192-193"}
  - {calcul: rho_marque, procedure: spearman, arguments: {x: SUACMOGA, y: IMPOMARQ}, source: "N08_A_RAPPORT_427.sps:192-193"}
  - {calcul: rho_paysav, procedure: spearman, arguments: {x: SUACMOGA, y: BOSAPACH}, source: "N08_A_RAPPORT_427.sps:192-193"}
  - {calcul: rho_fidel, procedure: spearman, arguments: {x: SUACMOGA, y: FIMEFOUR}, source: "N08_A_RAPPORT_427.sps:192-193"}
  - {texte: "Ce qui fait accepter un prix plus élevé. Le surcoût accepté ne dépend pas du maillon de la chaîne (Kruskal-Wallis, p [[kw_maillon.p_txt]]), mais il varie selon la ville (p [[kw_ville.p_txt]]) et le profil (p [[kw_profil.p_txt]]). Surtout, il augmente avec quatre attitudes (corrélations de Spearman, n = [[rho_contref.base]] à [[rho_fidel.base]]) : l'importance accordée au SAV (|ρ| = [[rho_sav.rho_abs]]), la crainte de la contrefaçon ([[rho_contref.rho_abs]]), l'écart de qualité perçu entre haut et bas de gamme ([[rho_ecart.rho_abs]]) et l'importance de la marque ([[rho_marque.rho_abs]]) ; la disposition à payer un bon SAV et la fidélité au fournisseur ([[rho_paysav.rho_abs]] et [[rho_fidel.rho_abs]]) vont dans le même sens. Notre lecture : la prime de prix existe, mais elle se mérite auprès d'une clientèle précise, celle qui a peur d'être trompée et qui tient au service. C'est l'argument le plus direct de l'enquête en faveur d'un positionnement de confiance."}
  - {texte: "Note de lecture : corrélations faibles à modérées, toutes significatives au seuil de [[lit:1]] % ; elles indiquent une association, pas un lien de cause à effet. Dans la sortie SPSS, le signe est négatif parce que les échelles d'attitude sont codées de [[lit:1]] = « très » à [[lit:4]] = « pas du tout »."}
  - {figure: "36", id: g36, titre: "Disposition à payer plus cher pour un bon service après-vente, par profil", source: "N08_A_RAPPORT_427.sps:196-198",
     procedure: tri_croise, arguments: {ligne: BOSAPACH, colonne: PROFIL4}, forme: empilees}
  - {calcul: payer_sav, procedure: frequences, arguments: {variable: BOSAPACH}, source: "N08_A_RAPPORT_427.sps:197"}
  - {texte: "La disposition à payer plus cher pour un bon service après-vente se présente comme suit : particuliers, oui pour [[g36.col(1|1)]] % et peut-être pour [[g36.col(2|1)]] % ; entreprises (PME + BTP), oui pour [[g36.col(1|2)]] % et peut-être pour [[g36.col(2|2)]] % ; électriciens / artisans, oui pour [[g36.col(1|3)]] % et peut-être pour [[g36.col(2|3)]] % ; revendeurs / grossistes, oui pour [[g36.col(1|4)]] % et peut-être pour [[g36.col(2|4)]] % ([[g36.col(3|4)]] % refusent) ; ensemble, oui pour [[payer_sav.pct(1)]] %, peut-être pour [[payer_sav.pct(2)]] %, non pour [[payer_sav.pct(3)]] %."}
  - {section: "c) Les critères déterminants dans le choix d'une marque", niveau: 4}
  - {figure: "37", id: g37, titre: "Importance de certaines caractéristiques influençant le choix d'une marque", source: "N08_A_RAPPORT_427.sps:200-201",
     procedure: indicateurs, arguments: {variables: [P_IMPSAV, P_IMPMARQ, P_ECARTQ, P_INFLORIG]}}
  - {texte: "Le service après-vente arrive en tête des attentes ([[g37.ligne(P_IMPSAV)]] % le jugent important ou très important), devant la marque ([[g37.ligne(P_IMPMARQ)]] %) et l'écart de qualité entre gammes ([[g37.ligne(P_ECARTQ)]] %) ; l'origine n'influence fortement ou modérément l'achat que de [[g37.ligne(P_INFLORIG)]] % des répondants. Notre lecture : l'acheteur cherche d'abord à être protégé après l'achat, plus qu'un pays d'origine."}
  - {section: "d) Niveau de satisfaction actuelle : déceptions, craintes et freins", niveau: 4}
  - {figure: "38", id: g38, titre: "Déceptions, crainte de la contrefaçon, freins à l'achat et fidélité au fournisseur", source: "N08_A_RAPPORT_427.sps:203-206",
     procedure: batterie, arguments: {variables: [DEJDECAC, CRACPRCO, PRINFREI, FIMEFOUR]}, forme: panneaux}
  - {texte: "Le questionnaire ne comporte pas de note de satisfaction globale : la satisfaction est approchée par les déceptions, la crainte de la contrefaçon, les freins et la fidélité. Le diagnostic est sévère : [[s1.ligne(P_DECU)]] % des acheteurs ont déjà été déçus ([[g38.pct(DEJDECAC|1)]] % plusieurs fois), [[g38.pct(CRACPRCO|1)]] % craignent souvent la contrefaçon, et le doute sur la qualité ([[g38.pct(PRINFREI|2)]] %) est le premier frein, à égalité avec le prix ([[g38.pct(PRINFREI|1)]] %). Notre lecture : le marché manque moins de produits que de produits dignes de confiance."}
  - {calcul: decu_origine, procedure: tri_croise, arguments: {ligne: DEJDECAC, colonne: ORIG_MARQ}, source: "N08_A_RAPPORT_427.sps:205-206"}
  - {calcul: crainte_origine, procedure: tri_croise, arguments: {ligne: CRACPRCO, colonne: ORIG_MARQ}, source: "N08_A_RAPPORT_427.sps:205-206"}
  - {calcul: decu_gamme, procedure: tri_croise, arguments: {ligne: DEJDECAC, colonne: GAACPLSO}, source: "N08_A_RAPPORT_427.sps:205-206"}
  - {calcul: frein_gamme, procedure: tri_croise, arguments: {ligne: PRINFREI, colonne: GAACPLSO}, source: "N08_A_RAPPORT_427.sps:205-206"}
  - {texte: "Qui est déçu ? La déception et la crainte ne touchent pas d'abord les acheteurs du bas de gamme, mais ceux qui paient pour la qualité. Parmi les acheteurs de marques européennes, [[decu_origine.col(1|1)]] % ont été déçus plusieurs fois ([[decu_origine.col(1|2)]] % pour les marques asiatiques) et [[crainte_origine.col(1|1)]] % craignent souvent la contrefaçon ([[crainte_origine.col(1|2)]] %). Selon la gamme, [[decu_gamme.col(1|2)]] % des acheteurs de moyenne gamme et [[decu_gamme.col(1|1)]] % de ceux du haut de gamme ont été déçus plusieurs fois, contre [[decu_gamme.col(1|3)]] % de ceux du bas de gamme. Le premier frein suit la même ligne : le prix pour les acheteurs du bas de gamme ([[frein_gamme.col(1|3)]] %), le doute sur la qualité pour ceux du haut de gamme ([[frein_gamme.col(2|1)]] %). Notre lecture : le problème de confiance se concentre précisément sur le segment visé par un distributeur de moyenne gamme ; c'est une opportunité, à condition que la promesse soit tenue."}
  - {texte: "Note de lecture : croisements significatifs (khi-deux, V de Cramér de [[decu_origine.v]] à [[frein_gamme.v]] ; bases de [[crainte_origine.base]] à [[decu_gamme.base]] réponses selon la question). Pour les freins, plus de [[lit:20]] % des cases ont un effectif théorique inférieur à [[lit:5]] : écart à lire comme une tendance."}
  - {figure: "39", id: g39, titre: "Service après-vente attendu en priorité, par ville", source: "N08_A_RAPPORT_427.sps:208-210",
     procedure: tri_croise, arguments: {ligne: SEATPRIO, colonne: VILLEREG}, forme: groupees}
  - {calcul: service, procedure: frequences, arguments: {variable: SEATPRIO}, source: "N08_A_RAPPORT_427.sps:209"}
  - {texte: "Logiquement, le service attendu en priorité est la garantie avec remplacement ([[service.pct(1)]] %), devant le conseil technique ([[service.pct(2)]] %) et la réparation ou les pièces ([[service.pct(3)]] %). Le conseil technique est davantage attendu à Yaoundé ([[g39.col(2|2)]] %), la réparation à Bafoussam ([[g39.col(3|3)]] %)."}
  - {figure: "40", id: g40, titre: "Leviers de fidélisation attendus d'un fournisseur de matériels électriques", source: "N08_A_RAPPORT_427.sps:212-214",
     procedure: frequences, arguments: {variable: LEVFIDEL}, forme: secteurs}
  - {texte: "Interrogés sur ce qui renforcerait d'abord leur fidélité (une seule réponse par fiche), les clients citent les prix et promotions ([[g40.pct(1)]] %) à égalité avec une qualité constante ([[g40.pct(2)]] %), puis la disponibilité du stock ([[g40.pct(3)]] %). Le SAV fiable ([[g40.pct(5)]] %), le conseil ([[g40.pct(4)]] %), les facilités de paiement ([[g40.pct(7)]] %) et les programmes de fidélité ([[g40.pct(6)]] %) passent après ces fondamentaux : le SAV est une exigence, plus qu'un argument qui retient."}
  - {section: "e) Le volume et le potentiel du marché", niveau: 4}
  - {calcul: en_ligne, procedure: frequences, arguments: {variable: PRETACLI}, source: "N08_A_RAPPORT_427.sps:216-218"}
  - {calcul: contact, procedure: frequences, arguments: {variable: CACOPREF}, source: "N08_A_RAPPORT_427.sps:293-295"}
  - {texte: "Indicateurs de volume issus de l'enquête. L'enquête fournit des indicateurs de volume au niveau de chaque acheteur : [[frequence.pct(1,2)]] % achètent au moins une fois par mois et la dépense annuelle médiane estimée est de [[depense_profil.mediane_millions]] millions FCFA par acheteur (moyenne de [[depense_profil.moyenne_millions]] millions FCFA, tirée par les gros acheteurs). Les entreprises, peu nombreuses, concentrent la plus forte dépense."}
  - {texte: "Le potentiel de croissance est porté par le solaire et les onduleurs ([[g11.pct(PRACSOLA)]] % des acheteurs, [[q9_entreprises.pct(PRACSOLA)]] % des entreprises) et par l'ouverture au commerce en ligne ([[en_ligne.pct(1,2)]] % de « oui » ou « peut-être »)."}
  - {texte: "Données à compléter. La taille totale du marché en valeur ne peut pas être déduite de l'enquête, dont l'échantillon n'est pas représentatif de l'ensemble des acheteurs du pays. Elle doit être établie par une recherche documentaire : statistiques douanières d'importation de matériel électrique, recensement des grossistes et quincailleries par ville. Indicateurs à rechercher : volume et valeur des importations de matériel électrique par origine ; évolution sur cinq ans ; nombre de points de vente. Ces données permettront de calculer le marché adressable et la part de marché visée par un nouveau distributeur."}
  - {texte: "Tendances observées : demande de qualité vérifiable, montée du solaire, usage de WhatsApp pour le contact commercial ([[contact.pct(3)]] %)."}

