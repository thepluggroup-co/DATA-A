  - {texte: "Une typologie en quatre groupes a été testée (méthode TwoStep, huit variables d'attitude et de comportement, [[typo.base]] fiches complètes sur [[base.retenues]]). Elle n'est pas retenue comme segmentation du marché : sa mesure de silhouette est de [[lit:0,14]], sous le seuil de [[lit:0,20]] en dessous duquel les groupes se chevauchent trop, et le critère BIC suggère plutôt trois groupes. Elle est présentée ici comme une piste à tester pendant le pilote, notamment le groupe [[lit:4]], cible naturelle d'un distributeur de confiance."}
  - {texte: "Note de lecture : les groupes sont ceux enregistrés lors du traitement SPSS (TwoStep dépend de l'ordre des fiches : une nouvelle exécution donnerait des groupes un peu différents) ; ils sont relus dans la base livrée, fiche par fiche. La mesure de silhouette et le critère BIC sont relevés dans la sortie SPSS (visionneuse de modèles) ; la plateforme ne les recalcule pas. Les caractéristiques retenues sont celles dont le résidu ajusté dépasse [[lit:1,96]]."}
