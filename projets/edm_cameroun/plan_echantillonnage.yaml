  3: {cible: Électricien/artisan, DOUALA: 40, YAOUNDE: 40, BAFOUSSAM: 20}
  4: {cible: Entreprise BTP, DOUALA: 40, YAOUNDE: 40, BAFOUSSAM: 20}
  5: {cible: Revendeur/Grossiste/Distributeur, DOUALA: 50, YAOUNDE: 50, BAFOUSSAM: 30}
parametres_qualite:        # V11, CONFIG
  objectif_jour: 25
  nb_jours: 3
